  { q: "You have identified a common malware variant on a potentially infected computer. You need to find reliable IOCs and malware behaviors as quickly as possible to confirm whether the computer is infected and search for signs of infection on other computers. What should you do?", opts: ["Create a Compute Engine VM, and perform dynamic and static malware analysis.", "Perform a UDM search for the file checksum in Google Security Operations (SecOps). Review activities associated with, or attributed to the malware.", "Run a Google Web Search for the malware hash, and review the results.", "Search for the malware hash in Google Threat Intelligence, and review the results."], ans: [3], exp: "Google Threat Intelligence provides curated IOCs, behavioral data, and context for known malware hashes. Much faster and more reliable than manual analysis or web search." },
  { q: "Your Google Security Operations (SecOps) SOAR integration with Security Command Center (SCC) uses a service account with read access to findings at the organization level. SOAR successfully reads SCC finding data, but actions attempting to update finding states consistently fail with a permission denied error. You need to resolve this error while following the principle of least privilege. What should you do?", opts: ["Grant the service account the roles/securitycenter.findingsBulkMuteEditor IAM role at the organization level.", "Grant the service account the roles/securitycenter.findingsEditor IAM role at the organization level.", "Grant the service account the roles/iam.serviceAccountUser IAM role to itself.", "Regenerate the service account key, and update the credentials in Google SecOps SOAR."], ans: [1], exp: "roles/securitycenter.findingsEditor grants the minimum permission needed to update finding states, the least-privilege role that resolves the permission denied error." },
  { q: "You need to augment your organization's existing Security Command Center (SCC) implementation with additional detectors. You have a list of known IOCs and would like to include external signals to ensure broad detection coverage. What should you do?", opts: ["Create an Event Threat Detection custom module using the 'Configurable Bad IP' template.", "Create a Security Health Analytics (SHA) custom module using the compute address resource.", "Create a custom posture for your organization that combines the prebuilt Event Threat Detection and Security Health Analytics (SHA) detectors.", "Create a custom log sink with internal and external IP addresses from threat intelligence. Use the SCC API to generate a finding for each event."], ans: [0], exp: "The ETD 'Configurable Bad IP' template is purpose-built for ingesting external IP-based threat intelligence signals into SCC detections." },
  { q: "Your organization recently implemented Google Security Operations (SecOps). You need to create a solution that allows the security team to monitor data ingestion into Google SecOps in real time and automatically sends a notification if one of the data sources stops ingesting data. You need to minimize the cost of these configurations. What should you do?", opts: ["Create Looker dashboards to visualize the data ingestion, and configure an alerting policy in Looker to send a notification in case of failure.", "Create Looker dashboards to visualize the data ingestion, and configure an alerting policy in Cloud Monitoring to send a notification in case of failure.", "Use Google SecOps SIEM dashboards to visualize the data ingestion and configure an alerting policy in Cloud Logging to send a notification in case of failure.", "Use Google SecOps SIEM dashboards to visualize the data ingestion, and configure an alerting policy in Cloud Monitoring to send a notification in case of failure."], ans: [3], exp: "Google SecOps SIEM dashboards (no additional cost) plus Cloud Monitoring alerting (cost-effective) is the minimum-cost combination that meets both requirements." },
  { q: "Your company's Google Security Operations (SecOps) instance has three roles: Tier 1, Tier 2, and Tier 3. Currently, analysts in all tiers can access all cases. Your company's SOC has a new requirement to restrict access to cases assigned to the Tier 3 role from the other tiers. What should you do?", opts: ["Instruct analysts in Tier 1 and Tier 2 to create a case queue filter to exclude cases assigned to the Tier 3 role.", "Revoke additional role access from Tier 1 and Tier 2 analysts.", "Configure the Cross Environment Policy to allow users to move cases between environments. Move Tier 3 cases to an environment that only Tier 3 analysts can access.", "Assign the cases to a user in the Tier 3 role."], ans: [2], exp: "Moving Tier 3 cases to a dedicated environment that only Tier 3 analysts can access enforces true access control. Filters or role changes do not provide hard isolation." },
  { q: "You are the lead engineer on your organization's incident response team. You are running CrowdStrike Falcon and SentinelOne to protect the Windows devices in different regions. You notice that a high volume of ransomware incidents are impacting your team's SLAs. You need to automate the response to ransomware on Windows devices. How should you automate the detection and containment of ransomware incidents? (Choose two.)", opts: ["Enable the Windows Threats category in curated detections to detect the latest Windows threats.", "Enable the Risk Analytics for User and Endpoint Behavioral Analytics (UEBA) category in curated detections.", "Install SOAR EDR integrations for endpoint containment actions. Create a playbook to contain impacted Windows devices based on curated detections.", "Install SOAR EDR jobs to execute remote endpoint containment actions. Create a playbook to contain impacted Windows devices based on curated detections.", "Install a SOAR remote agent on each Windows device for endpoint containment actions."], ans: [0, 2], exp: "A: Windows Threats curated detections cover ransomware patterns for these EDR log types. C: SOAR EDR integrations (not jobs or agents) enable automated endpoint containment actions from playbooks.", multi: true },
  { q: "You need to ingest audit logs from your organization's entire Google Cloud environment into Google Security Operations (SecOps), including Cloud NAT logs for workloads within a designated folder. You want to minimize integration complexity. You have already enabled Google Cloud data ingestion into Google SecOps. What should you do next?", opts: ["Create a custom filter to export the folder-level Cloud NAT logs.", "Create a custom filter to export the project-level Cloud NAT logs for each project in the environment folder.", "Configure an aggregated log sink at the folder level, and route the Cloud NAT logs to Pub/Sub. Enable the Pub/Sub connector for Google SecOps.", "Configure an aggregated log sink at the organization level, and route the Cloud NAT logs to a Cloud Storage bucket. Configure the Cloud Storage connector for Google SecOps."], ans: [2], exp: "A folder-level aggregated log sink captures logs from all projects in the folder without project-by-project configuration, and Pub/Sub connector provides low-latency delivery." },
  { q: "You work for an organization that operates an ecommerce platform. You have identified a remote shell on your company's web host. The existing incident response playbook is outdated and lacks specific procedures for handling this attack. You want to create a new, functional playbook that can be deployed as soon as possible by junior analysts. What should you do?", opts: ["Add instruction actions to the existing incident response playbook that include updated procedures. Have a senior analyst build out the playbook.", "Use the playbook creation feature in Gemini, and enter details about the intended objectives. Add the necessary customizations for your environment, and test the generated playbook against a simulated remote shell alert.", "Use Gemini to generate a playbook based on a template from a standard incident response plan and implement automated scripts to filter network traffic based on known malicious IP addresses.", "Create a new custom playbook based on industry best practices, and work with an offensive security team to test the playbook against a simulated remote shell alert."], ans: [1], exp: "Gemini's playbook creation feature generates a deployable playbook quickly from a description. Junior analysts can use it immediately after customization and testing." },
  { q: "You recently joined a company that uses Google Security Operations (SecOps) with Applied Threat Intelligence enabled. You have alert fatigue from a recent red team exercise. You need to filter out IOCs that you suspect were generated due to the exercise. What should you do?", opts: ["Ask Gemini to provide a list of IOCs from the red team exercise.", "Filter IOCs with an ingestion time that matches the time period of the red team exercise.", "Navigate to the IOC Matches page. Identify and mute the IOCs from the red team exercise.", "Navigate to the IOC Matches page. Review IOCs with an Indicator Confidence Score (IC-Score) label >= 80%."], ans: [2], exp: "Muting specific IOCs from the exercise on the IOC Matches page directly suppresses the false positives without affecting other detections." },
  { q: "You are managing the integration of Security Command Center (SCC) with downstream tooling. You need to pull security findings from SCC and import those findings as part of Google Security Operations (SecOps) SOAR actions. You need to configure the connection between SCC and Google SecOps. What should you do?", opts: ["Install the Google Rapid Response integration from the Google SecOps Marketplace. Gather information about the findings from the appropriate server.", "Install the SCC integration from the Google SecOps Marketplace. Grant the SCC API the appropriate IAM roles to integrate with the Google SecOps instance. Configure this integration using a generated API key scoped to the SCC API.", "Create a Pub/Sub topic with a NotificationConfig object and a push subscription for the desired finding types. Grant the Google SecOps service account the appropriate IAM roles to read from this subscription.", "Create a Pub/Sub topic with a NotificationConfig object and a push subscription. Create a new Google SecOps service account, grant appropriate IAM roles, export the credentials, and import into Google SecOps SOAR."], ans: [1], exp: "The built-in SCC Marketplace integration handles the connection natively. No custom Pub/Sub infrastructure needed." },
  { q: "You are configuring a new integration in Google Security Operations (SecOps) to perform enrichment actions in playbooks. This enrichment technology is located in a private data center that does not allow inbound network connections. You need to connect your Google SecOps instance to the integration. What should you do?", opts: ["Create a forwarder in the private data center. Configure an instance of the integration to run on the forwarder.", "Query the enrichment source in the private data center and upload the results to the case wall in Google SecOps.", "Create a network route in Google Cloud to the private data center.", "Create a remote agent in the private data center. Configure an instance of the integration to run on a remote agent in Google SecOps."], ans: [3], exp: "Remote agents are designed for exactly this scenario. They initiate outbound connections from the private network to Google SecOps, bypassing the inbound restriction." },
  { q: "You use Google Security Operations (SecOps) curated detections and YARA-L rules to detect suspicious activity on Windows endpoints. Your source telemetry uses EDR and Windows Events logs. Your rules match on the principal.user.userid UDM field. You need to ingest an additional log source for this field to match all possible log entries. What should you do?", opts: ["Ingest logs from Windows Sysmon.", "Ingest logs from Microsoft Entra ID.", "Ingest logs from Windows PowerShell.", "Ingest logs from Windows Procmon."], ans: [0], exp: "Windows Sysmon provides detailed process and network event telemetry with user context that fills gaps in EDR and Windows Event log coverage for the principal.user.userid field." },
  { q: "You are an incident response engineer at an organization that uses Google Security Operations (SecOps). You recently started monitoring IOCs in Applied Threat Intelligence using YARA-L rules. You have discovered that there are more false positive alerts than expected. You need to reduce the number of false positive alerts. What should you do?", opts: ["Modify the YARA-L rules to use an indicator confidence score (IC-Score) of 60% and above.", "Configure alert grouping for the most repetitive alerts.", "Implement curated detections instead of custom YARA-L rules.", "Create a playbook that automatically tunes the IOC source if its indicator confidence score (IC-Score) is between 60% and 80%."], ans: [0], exp: "Raising the minimum IC-Score threshold to 60% filters out low-confidence IOC matches that are more likely to be false positives." },
  { q: "You scheduled a Google Security Operations (SecOps) report to export results to a BigQuery dataset in your Google Cloud project. The report executes successfully in Google SecOps, but no data appears in the dataset. You confirmed that the dataset exists. How should you address this export failure?", opts: ["Grant the Google SecOps service account the roles/iam.serviceAccountUser IAM role to itself.", "Set a retention period for the BigQuery export.", "Grant the user account that scheduled the report the roles/bigquery.dataEditor IAM role on the project.", "Grant the Google SecOps service account the roles/bigquery.dataEditor IAM role on the dataset."], ans: [3], exp: "The Google SecOps service account needs bigquery.dataEditor on the specific dataset to write exported report data." },
  { q: "Your organization's Google Security Operations (SecOps) tenant is ingesting a vendor's firewall logs using the Google-provided parser. The vendor released a patch that introduces a new field and renames an existing field. The parser does not recognize these two fields and they remain available only in the raw logs. You need to resolve this logging issue as soon as possible while minimizing change management impact. What should you do?", opts: ["Write a code snippet, and deploy it in a parser extension to map both fields to UDM.", "Use the web interface-based custom parser feature in Google SecOps to copy the parser, and modify it to map both fields to UDM.", "Deploy a third-party data pipeline management tool to ingest the logs, and transform the updated fields into fields supported by the default parser.", "Use the Extract Additional Fields tool in Google SecOps to convert the raw log entries to additional fields."], ans: [3], exp: "The Extract Additional Fields tool provides a fast, low-impact way to surface new fields from raw logs without touching the parser." },
  { q: "Your company uses Cloud Identity to manage employee identities and has Google Security Operations (SecOps) linked to your Google Cloud project. You have assigned the roles/chronicle.viewer IAM role at the project level to a specific Google Group that contains users with external Google accounts. Users in this external group authenticate successfully to Google Cloud, but are unable to access Google SecOps. Internal users granted the same role can access Google SecOps. What Google Cloud configuration is most likely preventing the external users from accessing Google SecOps?", opts: ["External users must be synchronized to Cloud Identity using Google Cloud Directory Sync (GCDS) for IAM roles to take effect.", "Google SecOps inherently blocks sign-ins from identities outside the organization's primary domain.", "The constraints/iam.allowedPolicyMemberDomains organization policy is restricting IAM role assignments to identities within your company domain only.", "The roles/chronicle.viewer IAM role does not apply correctly when granted to Google Groups containing external identities."], ans: [2], exp: "The allowedPolicyMemberDomains org policy constraint prevents IAM roles from being granted to identities outside approved domains, explaining why external users are blocked." },
  { q: "Your company's SOC analysts frequently submit manual change requests to a system administrator to make changes to the firewall rules on a specific router. You have the firewall integration installed and configured. Your system administrator requires the ability to manually approve requested changes prior to deployment. How should you implement the workflow for analysts to trigger on demand?", opts: ["Create an email template for the analyst to get approval from the system administrator. Once approved, use a manual action to make the change to the firewall rule from any open case.", "Create an account for the system administrator in your Google SecOps instance to allow the system administrator to make the changes directly.", "Create a playbook where the firewall rule change is a manual step. Have the analyst email the system administrator with the change. Once approved, the analyst lets the playbook continue.", "Create a request in the Google SecOps SOAR settings that includes a field for the firewall rule. Create a playbook triggered by this request. Configure the playbook step to send an approval request from the system administrator including the parameter being changed."], ans: [3], exp: "A SOAR request plus playbook with a built-in approval step creates a structured, automated workflow that integrates the approval process directly into the deployment flow." },
  { q: "You are conducting proactive threat hunting in your company's Google Cloud environment. You suspect that an attacker compromised a developer's credentials and is attempting to move laterally from a development GKE cluster to critical production systems. You need to identify IOCs and prioritize investigative actions by using Google Cloud's security tools before analyzing raw logs in detail. What should you do next?", opts: ["In the Security Command Center (SCC) console, apply filters for the cluster and analyze the resulting aggregated findings' timeline and details for IOCs. Examine the attack path simulations associated with attack exposure scores to prioritize subsequent actions.", "Review threat intelligence feeds within Google Security Operations (SecOps), and enrich any anomalies with context on known IOCs, attacker TTPs, and campaigns.", "Investigate Virtual Machine (VM) Threat Detection findings in Security Command Center (SCC). Filter for VM Threat Detection findings to target the Compute Engine instances that serve as the nodes for the cluster.", "Create a Google SecOps SOAR playbook that automatically isolates any GKE resources exhibiting unusual network connections to production environments."], ans: [0], exp: "SCC's aggregated findings with attack path simulations and exposure scores provide the most comprehensive IOC context and prioritization guidance for GKE lateral movement scenarios." },
  { q: "During a high-priority phishing incident at your company, Google Security Operations (SecOps) created and assigned the case to a Tier 1 analyst. The analyst added email headers and attached the malicious file as evidence but failed to escalate the case, violating an internal SLA of 30 minutes for a phishing response. You want to optimize the case management workflow for future high-priority incidents. What should you do?", opts: ["Build a playbook that automatically ingests reported phishing emails, enriches entities with threat intelligence, determines the impact and assigns the case for review.", "Change the default case assignment logic to route all phishing alerts to the Tier 2 team.", "Configure a SOAR notification loop that sends escalating email alerts to the Tier 1 analysts, the Tier 2 analysts, and the SOC manager every five minutes until the case is manually reassigned.", "Update the playbook to automatically close phishing cases after 60 minutes if no manual response has occurred."], ans: [2], exp: "An escalating notification loop ensures the SLA breach does not go unnoticed and automatically escalates to higher tiers until the case is addressed." },
  { q: "You are writing a Google Security Operations (SecOps) SOAR playbook that uses the VirusTotal v3 integration to look up a URL that was reported by a threat hunter. You need to use the results to make a preliminary recommendation on the maliciousness of the URL and set the severity of the alert based on the output. What should you do? (Choose two.)", opts: ["Create a widget that translates the JSON output to a severity score.", "Use the number of detections from the response JSON in a conditional statement to set the severity.", "Verify that the response is accurate by manually checking the URL in VirusTotal.", "Pass the response back to the SIEM.", "Use a conditional statement to determine whether to treat the URL as suspicious or benign."], ans: [1, 4], exp: "B: Detection count from VT response is the standard indicator used in conditional logic for severity. E: A conditional for suspicious/benign classification drives the preliminary recommendation.", multi: true },
  { q: "You are using Google Security Operations (SecOps) to hunt for signs of lateral movement through Remote Desktop Protocol (RDP) in your organization. You suspect that a compromised account was used to access multiple internal systems within a short time window. You want to construct a UDM-based search to identify this activity. How should you build this query? (Choose two.)", opts: ["Filter for RDP connections with non-standard ports.", "Filter for events using protocol-level attributes that indicate RDP connections.", "Group events by user identity and time to identify repeated access patterns.", "Correlate events based on the asset role or classification such as database or user workstation.", "Use a saved search to identify all events with the LATERAL_MOVEMENT tag over the past 30 days."], ans: [1, 2], exp: "B: Protocol-level attributes (e.g., network.application_protocol = RDP) correctly identify RDP events in UDM. C: Grouping by user and time reveals the pattern of repeated access across systems.", multi: true },
  { q: "You are configuring role-based data access controls for two groups in Google Security Operations (SecOps). Group A requires access to all data, and Group B requires access to all data except data from the 'restricted' namespace. What should you do? (Choose two.)", opts: ["Create a custom label with a UDM query to include all labels for Group A. Assign this data label to Group A in IAM.", "Create a custom label with a UDM query to include all data except the 'restricted' namespace data for Group B. Assign this data label to Group B in IAM.", "Create a new data access scope to allow access to the 'restricted' namespace data for Group A. Assign this data scope to Group A in IAM.", "Create a new data access scope in the Google SecOps SIEM settings to allow access to all data for Group A. Assign this data access scope to Group A in IAM.", "Create a new data access scope in the Google SecOps SIEM settings to allow access to all data and exclude the 'restricted' namespace data for Group B. Assign this data access scope to Group B in IAM."], ans: [3, 4], exp: "D: A data access scope for all data grants Group A full access. E: A scope excluding the restricted namespace correctly limits Group B. Both configured in SIEM settings and assigned via IAM.", multi: true },
  { q: "Your organization is using a prebuilt parser to parse a complex but stable and common log source. The parser is working correctly. However, your organization now wants you to parse additional fields from the raw logs and map them to UDM fields. What should you do?", opts: ["Design and develop a custom parser.", "Apply any pending updates to the prebuilt parser.", "Implement a parser extension on top of the prebuilt parser.", "Implement middleware to modify the underlying data structure."], ans: [2], exp: "A parser extension adds new field mappings without replacing the working prebuilt parser, the correct approach for extending existing parser coverage." },
  { q: "Your company's risk management and compliance team requires regular reporting on compliance with industry standard control frameworks for a regulated business unit that continuously adds projects. You need to create a report that includes evidence of non-compliant resources. How should you generate this report?", opts: ["Run an audit using the compliance framework in Audit Manager. Export the evaluation for consumption by the second-line team.", "Run queries for the required controls using the Cloud Asset Inventory data stored in BigQuery. Schedule this report to run regularly.", "Implement the control framework using Rego, and deploy this framework in Workload Manager. Schedule a regular report in Workload Manager.", "Implement the built-in posture for the compliance framework within the Security Command Center (SCC) posture."], ans: [3], exp: "SCC postures with built-in compliance frameworks continuously monitor for non-compliance and automatically include new projects, the correct approach for a growing environment." },
  { q: "Your team hunts for threats in a large multinational corporation. You have subscriptions to threat intelligence feeds from third-party sources. You want to implement a solution to continuously compare DNS calls on endpoints to your threat intelligence feeds. What should you do?", opts: ["Use custom modules in Event Threat Detection in Security Command Center (SCC) to correlate feed data with Google Cloud logs.", "Push endpoint logs to BigQuery and use scripts to compare entries to Google Threat Intelligence by using a Google Threat Intelligence API key.", "Create a YARA-L rule in Google Security Operations (SecOps) to track matches between the ingested EDR log entries and the entity graph.", "Create a YARA-L rule in Google Security Operations (SecOps) to track matches between the ingested EDR log entries and the VirusTotal table in the entity graph."], ans: [2], exp: "A YARA-L rule in Google SecOps that joins EDR log entries with the entity graph enables continuous, real-time comparison of DNS calls against ingested threat intelligence." },
  { q: "Your company is adopting a multi-cloud environment. You need to configure comprehensive monitoring of threats using Google Security Operations (SecOps). You want to start identifying threats as soon as possible. What should you do?", opts: ["Use Gemini to generate YARA-L rules for multi-cloud use cases.", "Use curated detections from the Cloud Threats category to monitor your cloud environment.", "Use curated detections for Applied Threat Intelligence to monitor your company's cloud environment.", "Ask Cloud Customer Care to provide a set of rules recommended by Google to monitor your company's cloud environment."], ans: [1], exp: "Cloud Threats curated detections are purpose-built for multi-cloud threat monitoring and can be enabled immediately with no development required." },
  { q: "You have a close relationship with a vendor who reveals privately that they have discovered a vulnerability in their web application that can be exploited in an XSS attack. This application is running on servers in the cloud and on-premises. Before the CVE is released, you want to look for signs of the vulnerability being exploited in your environment. What should you do?", opts: ["Create a YARA-L 2.0 rule to detect a time-ordered series of events where an external inbound connection to a server was followed by a process on the server that spawned subprocesses previously not seen in the environment.", "Create a YARA-L 2.0 rule to detect high-prevalence binaries on your web server architecture communicating with known C2 nodes.", "Ask the Gemini Agent in Google Security Operations (SecOps) to search for the latest vulnerabilities in the environment.", "Activate a new Web Security Scanner scan in Security Command Center (SCC), and look for findings related to XSS."], ans: [0], exp: "A YARA-L rule detecting inbound connections followed by unusual process spawning captures the behavioral indicators of XSS exploitation before a CVE exists." },
  { q: "You have identified a new threat actor group that has several IOCs in Google Threat Intelligence. You want to use some of these IOCs in several detection rules in Google Security Operations (SecOps) to help identify suspicious activity. You want to use the most effective approach. What should you do?", opts: ["Identify the detection rules that apply to the new IOCs, and update the YARA-L logic to reference the threat actor group.", "Add the IOCs to a new or existing reference list, and update the YARA-L logic of detection rules to include the reference list.", "Save the IOCs in a new collection in Google Threat Intelligence. Share this list with other members of the security team.", "Configure a new data feed in Google SecOps that includes the IOCs. Update the YARA-L logic to reference the new IOCs."], ans: [1], exp: "Adding IOCs to a reference list and referencing it in YARA-L rules is the most effective approach for reusable, maintainable IOC-based detection across multiple rules." },
  { q: "You have noticed that a Google Security Operations (SecOps) detection rule that detects excessive network connections is triggering too frequently and creating too many false positive alerts. You want to improve the rule to reduce the noise without reducing the effectiveness of the rule. What change to the detection rule should you implement?", opts: ["Add a threshold in the YARA-L condition section to ensure that the rule only alerts after a certain number of connections.", "Assign a risk score in the YARA-L outcome section to prioritize alerts more effectively in the alert queue.", "Include a 10 minute timeframe for the same source and destination of network connections in the YARA-L match section to aggregate the alerts.", "Update the YARA-L events section to exclude the most common IP addresses involved in the network connection alerts."], ans: [0], exp: "Adding a threshold in the condition section ensures the rule only fires after a meaningful number of connections, reducing noise while preserving detection effectiveness." },
  { q: "You are a SOC analyst at an organization that uses Google Security Operations (SecOps). Alerts indicate repeated PowerShell activity on a set of endpoints. Outbound connections are made to a domain that does not appear in your threat intelligence feeds. The activity occurs across multiple systems and user accounts. You need to search across impacted systems and user identities to identify the malicious user and understand the scope of the compromise. What should you do?", opts: ["Perform a YARA-L 2.0 search to correlate activity across impacted systems and users.", "Perform a raw log search for the suspicious domain string, and manually pivot to related user activity.", "Use the User Sign-In Overview dashboard to monitor authentication trends and anomalies across all users.", "Use the Behavioral Analytics dashboard in Risk Analytics to identify abnormal IP-based activity and high-risk user behavior."], ans: [0], exp: "A YARA-L 2.0 search enables correlation across multiple UDM fields simultaneously, systems, users, domains, providing the comprehensive scope analysis needed." },
  { q: "Your company requires PCI DSS v4.0 compliance for its cardholder data environment (CDE) in Google Cloud. You use an SCC security posture based on the PCI DSS v4.0 template. This posture generates a finding indicating that a Compute Engine VM within the CDE scope has been configured with an external IP address. You need to take an immediate action to remediate the compliance drift. What should you do?", opts: ["Enable and enforce the constraints/compute.vmExternalIpAccess organization policy constraint at the project level for the project where the VM resides.", "Reconfigure the network interface settings for the VM to explicitly remove the assigned external IP address.", "Remove the CDE-specific tag from the VM to exclude the tag from this particular PCI DSS posture evaluation scan.", "Navigate to the underlying Security Health Analytics (SHA) finding for PUBLIC_IP_ADDRESS on the VM, and mark this finding as fixed."], ans: [1], exp: "Removing the external IP address directly remediates the compliance drift at the source. The other options either add future prevention or bypass the finding without fixing it." },
  { q: "You are responsible for managing threat intelligence and IOC lists in your organization. You have compiled a list of IOCs from recent incidents. You want to quickly and efficiently share the IOCs with other teams for collaboration and integration into their operational processes. What should you do?", opts: ["Create a list in Google Security Operations (SecOps), and grant the required access to the other teams.", "Export the IOCs from Google Threat Intelligence in CSV or JSON format, and email the file to the other teams.", "Add the IOCs to a collection in Google Threat Intelligence, and share the collection with the other teams.", "Create a new threat graph in Google Threat Intelligence, and share the graph with the other teams."], ans: [0], exp: "Creating a list in Google SecOps and granting access enables direct integration into operational processes like rules and playbooks, more actionable than sharing a collection or graph." },
  { q: "You are planning log onboarding for a Google Security Operations (SecOps) SIEM deployment in a cloud-heavy enterprise environment. The detection engineering team is requesting log sources that support visibility into: User identity behavior, Lateral movement, Privilege escalation attempts. You need to determine which telemetry sources are ingested first. Which log source should you prioritize?", opts: ["Cloud access security broker (CASB) logs", "EDR logs", "IAM logs", "Network firewall logs"], ans: [1], exp: "EDR logs provide visibility across all three requested areas, user identity behavior, lateral movement indicators, and privilege escalation attempts, on the endpoints themselves." },
  { q: "You are responsible for selecting and prioritizing potential sources of data to integrate with Google Security Operations (SecOps). Your company has recently started using several Google Cloud services to increase security in its Google Cloud organization. You need to determine which logs should be ingested into Google SecOps to reduce the effort required to write detections. What should you do?", opts: ["Ingest Google Cloud Armor logs by using Cloud Logging.", "Deploy a Bindplane agent to ingest event logs from Compute Engine VMs that provide endpoint visibility.", "Integrate Security Command Center (SCC) into Google SecOps to ingest logs originating from the Google Cloud services.", "Use Google Threat Intelligence to gain insight about threat group behavior and support threat hunting activities."], ans: [2], exp: "Integrating SCC into Google SecOps ingests pre-processed findings and security events from multiple Google Cloud services in one integration, reducing the effort to write detections." },
  { q: "You are developing a security strategy for your organization. You are planning to use Google Security Operations (SecOps) and Google Threat Intelligence (GTI). You need to enhance the detection and response across multi-cloud and on-premises systems. How should you integrate these products? (Choose two.)", opts: ["Ingest GTI IOCs into Google SecOps as security events.", "Ingest on-premises and cloud security logs into Google SecOps SIEM as events.", "Ingest on-premises and cloud security logs into Google SecOps SIEM as entities.", "Use Google SecOps SOAR integrations with GTI for event enrichment.", "Use Google SecOps SOAR integrations with GTI for entity enrichment."], ans: [1, 3], exp: "B: Security logs are ingested as events (not entities) into SIEM for detection. D: SOAR integrations with GTI enrich events during investigation. These are the correct integration patterns.", multi: true },
  { q: "Your organization is a Google Security Operations (SecOps) customer. The compliance team requires a weekly export of case resolutions and SLA metrics of high and critical severity cases over the past week. The compliance team's post-processing scripts require this data formatted as tabular data in CSV files, zipped, and delivered to their email each Monday morning. What should you do?", opts: ["Generate a report in SOAR Reports, and schedule delivery of the report.", "Use statistics in search, and configure a Google SecOps SOAR job to format and send the report.", "Build an Advanced Report in SOAR Reports, and schedule delivery of the report.", "Build a detection rule with outcomes, and configure a Google SecOps SOAR job to format and send the report."], ans: [1], exp: "Using statistics in search to extract the data and a SOAR job to format as CSV, zip, and email on schedule meets all requirements including the CSV/zip delivery format." },
  { q: "You are reviewing the results of a UDM search in Google Security Operations (SecOps). The UDM fields shown in the default view are not relevant to your search. You want to be able to quickly view the relevant data for your analysis. What should you do?", opts: ["Download the search results as a CSV file, and manipulate the data to display relevant data in a spreadsheet.", "Create a Google SecOps SIEM dashboard based on the search you have run, and visualize the data in an appropriate table or graphical format.", "Select the events of interest, and choose the relevant UDM fields from the event view using the checkboxes. Copy, extract, and analyze the UDM fields, and refine the search query.", "Use the columns feature to select or remove columns that are relevant to your analysis."], ans: [3], exp: "The columns feature directly customizes which UDM fields appear in the search results view, the fastest way to show only relevant data." },
  { q: "Your organization uses the curated detection rule set in Google Security Operations (SecOps) for high priority network indicators. You are finding a vast number of false positives coming from your on-premises proxy servers. You need to reduce the number of alerts. What should you do?", opts: ["Configure a rule exclusion for the network.asset.ip field.", "Configure a rule exclusion for the principal.ip field.", "Configure a rule exclusion for the target.domain field.", "Configure a rule exclusion for the target.ip field."], ans: [0], exp: "network.asset.ip represents the asset (the proxy server) generating the traffic. Excluding it properly targets the proxy's IP without affecting other detection logic." },
  { q: "Your third-party application data is published in a Pub/Sub topic located in a separate Google Cloud project from your Google Security Operations (SecOps) instance. Your attempts to push data from the Pub/Sub topic to Google SecOps have failed. You need to send this data into Google SecOps in a low-latency, robust way. What should you do?", opts: ["Push the data to Cloud Logging, and modify the export filter in direct ingestion.", "Enable the Chronicle API in the project that owns the Pub/Sub topic to push the subscription to Google SecOps.", "Create a Cloud Run function that is subscribed to the Pub/Sub topic and uses a Google SecOps Ingestion API key to push the data into Google SecOps.", "Send Pub/Sub messages to a Cloud Storage bucket. Create an ingestion feed in Google SecOps to read from the bucket."], ans: [2], exp: "A Cloud Run function as a Pub/Sub subscriber with the Ingestion API provides reliable, low-latency, event-driven data forwarding regardless of project boundaries." },
  { q: "Your organization requires the SOC director to be notified by email of escalated incidents and their results before a case is closed. You need to create a process that automatically sends the email when an escalated case is closed. What process should you use?", opts: ["Use the Close Case button in the UI to close the case. If the case is marked as an incident, export the case from the UI and email it to the director.", "Write a job to check closed cases for incident escalation status, pull the case status details if a case has been escalated, and send an email to the director.", "Navigate to the Alert Overview tab to close the Alert. Run a manual action to gather the case details. If the case was escalated, email the notes to the director.", "Create a playbook block that includes a condition to identify cases that have been escalated. The two resulting branches either close the alert and email the notes to the director, or close the alert without sending an email."], ans: [3], exp: "A playbook with a conditional branch based on escalation status automates the decision reliably at closure time, ensuring consistent email delivery for escalated cases only." },
  { q: "You are a security analyst at an organization that uses Google Security Operations (SecOps). You have identified a new IP address that is known to be used by a malicious threat actor to launch network attacks. You need to search for this IP address in Google SecOps using all normalized logs to determine whether any malicious activity has occurred. You want to use the most effective approach. What should you do?", opts: ["Write a YARA-L 2.0 detection rule that searches for events with the IP address.", "Run raw log searches using the IP address as a search term.", "On the Alerts and IOCs page, review results and entries where the IP address appears.", "Write UDM searches using YARA-L 2.0 syntax to find events where the IP address appears."], ans: [3], exp: "UDM search using YARA-L 2.0 syntax queries all normalized log fields across all log types, more comprehensive than raw search and more immediate than writing a detection rule." },
  { q: "You have been tasked with developing a new response process in a playbook to contain an endpoint. The new process should send an email to users who do not have a Google Security Operations (SecOps) account to request approval for endpoint containment and automatically continue executing its logic after the user responds. What should you do?", opts: ["Set the containment action to Manual and assign the action to the user to execute or skip the containment action.", "Set the containment action to Manual and assign the action to the appropriate tier. Contact the user by email to request approval. The analyst chooses to execute or skip the containment action.", "Use the Send Email action to send an email requesting approval to contain the endpoint, and use the Wait For Thread Reply action to receive the result. The analyst manually contains the endpoint.", "Generate an approval link for the containment action and include the placeholder in the body of the Send Email action. Configure additional playbook logic to manage approved or denied containment actions."], ans: [3], exp: "Approval links allow non-SOAR users to approve/deny actions via email click, and the playbook automatically continues based on the response, minimal analyst effort." },
  { q: "Your organization plans to ingest logs from an on-premises MySQL database as a new log source into its Google Security Operations (SecOps) instance. You need to create a solution that minimizes effort. What should you do?", opts: ["Configure a third-party API feed in Google SecOps.", "Configure direct ingestion from your Google Cloud organization.", "Configure and deploy a Google SecOps forwarder.", "Configure and deploy a Bindplane collection agent."], ans: [2], exp: "The Google SecOps forwarder is designed for on-premises log collection and supports MySQL, minimal effort compared to custom API feeds for this use case." },
  { q: "Your organization is a Google Security Operations (SecOps) customer. You use Google Threat Intelligence to identify cyber threats within your organization's threat profile. You believe your organization may have been targeted by a cyber crime group. You need to identify whether your organization has been the victim of an attack. What should you do?", opts: ["Implement monitors in the Digital Threat Monitoring feature to identify new compromised credentials, dark web mentions, or data leaks.", "In the Reports and Analysis feature, extract the IOCs from the recent reports, and implement detection rules and lists in Google SecOps to identify whether they are present in your organization's environment.", "Review the Threat Landscape feature to identify threat groups that are active in your industry, research their known MITRE ATT&CK TTPs and implement detection rules in Google SecOps.", "In the Vulnerability Intelligence feature, identify new high and critical vulnerabilities in products or technologies that your organization uses so they can be patched."], ans: [1], exp: "Extracting IOCs from threat intelligence reports and searching for their presence in your environment directly answers whether you have been victimized by that specific group." },
  { q: "You are implementing Google Security Operations (SecOps). Your organization has their own threat intelligence feed ingested to Google SecOps by using a native integration with a Malware Information Sharing Platform (MISP). You are working on a detection rule to leverage C2 indicators ingested into the entity graph. What code should you add in the detection rule to filter for the domain IOCs?", opts: ["$ioc.graph.metadata.entity_type = 'DOMAIN_NAME' AND $ioc.graph.metadata.source_type = 'ENTITY_CONTEXT'", "$ioc.graph.metadata.entity_type = 'DOMAIN_NAME' AND $ioc.graph.metadata.source_type = 'GLOBAL_CONTEXT'", "$ioc.graph.metadata.entity_type = 'DOMAIN_NAME' AND $ioc.graph.metadata.source_type = 'DERIVED_CONTEXT'", "$ioc.graph.metadata.entity_type = 'DOMAIN_NAME' AND $ioc.graph.metadata.source_type = 'SOURCE_TYPE_UNSPECIFIED'"], ans: [0], exp: "ENTITY_CONTEXT is the source_type used for threat intelligence ingested from external platforms like MISP via native integrations into the entity graph." },
  { q: "You are using Google Security Operations (SecOps) to identify and report a repetitive sequence of brute force SSH login attempts on a Compute Engine image that did not result in a successful login. You need to gain visibility into this activity while minimizing impact on your ingestion quota. Which log type should you ingest into Google SecOps?", opts: ["VPC Flow Logs", "Security Command Center Premium (SCCP) findings", "Cloud IDS logs", "Cloud Audit Logs"], ans: [0], exp: "VPC Flow Logs capture network connection metadata including SSH (port 22) attempts with minimal data volume, sufficient for identifying brute force patterns." },
  { q: "You are a SOC analyst working a case in Google Security Operations (SecOps). The case contains a file hash that your playbooks have automatically enriched with VirusTotal context and categorized as likely malicious. You need to quickly identify devices and users in your organization who have interacted with this file. What should you do?", opts: ["Build a playbook to perform a UDM search matching on the file hash in Google SecOps SIEM.", "Build a playbook to query your threat intelligence platform (TIP) for the presence of the file hash.", "Use a manual action in Google SecOps SOAR to perform a UDM search matching on the file hash in Google SecOps SIEM.", "Use a manual action in Google SecOps SOAR to query your threat intelligence platform (TIP) for the presence of the file hash."], ans: [0], exp: "A playbook-automated UDM search for the file hash identifies affected devices and users systematically across all ingested logs without requiring analyst intervention." },
  { q: "You are responsible for monitoring the ingestion of critical Windows server logs to Google Security Operations (SecOps) by using the Bindplane agent. You want to receive an immediate notification when no logs have been ingested for over 30 minutes. You want to use the most efficient notification solution. What should you do?", opts: ["Create a new YARA-L rule in Google SecOps SIEM to detect the absence of logs from the server within a 30-minute window.", "Configure a Bindplane agent to send a heartbeat signal to Google SecOps every 15 minutes, and create an alert if two heartbeats are missed.", "Create a new alert policy in Cloud Monitoring that triggers a notification based on the absence of logs from the server's hostname.", "Configure the Windows server to send an email notification if there is an error in the Bindplane process."], ans: [2], exp: "Cloud Monitoring alert policies with metric absence conditions are native, purpose-built for detecting silent log sources with precise time thresholds." },
  { q: "You observe several distinct, low-severity suspicious activities associated with a single internal server. You determine that no single event is a high-confidence IOC. You need to create a solution that ensures ongoing and heightened scrutiny for this server. What should you do?", opts: ["Schedule a daily Google Security Operations (SecOps) report detailing all activity on this server.", "Develop a YARA-L detection rule specific to this server.", "Add the server to a Google Security Operations (SecOps) watchlist, and monitor the watchlist closely for the next few weeks.", "Create a case, isolate the server from the network, and escalate the case for forensic investigation."], ans: [2], exp: "A watchlist is designed for monitoring entities with uncertain risk over time. It provides heightened visibility without the overhead of rule creation or premature escalation." },
  { q: "Your organization recently adopted Google Security Operations (SecOps), and has configured ingestion, parsing and rules for their log sources. The security operations team is currently triaging alerts one at a time using several external product dashboards. You want to use the case management functionality in Google SecOps to reduce the amount of pivoting between products your SOC analysts are required to do. You want to minimize development effort. What should you do first?", opts: ["Build a playbook for each detection rule to enrich and remediate alerts relative to the particular threat each rule is designed to detect.", "Build a playbook for each of the noisiest alert sources to gather additional context on the case from the source product.", "Build a job to periodically iterate over recent cases, determine relevant context, and enrich alerts.", "Build a low-priority, catch-all playbook for enrichment of entities in a case using threat intelligence sources."], ans: [3], exp: "A catch-all enrichment playbook immediately adds value across all cases with minimal development effort, the best first step to reduce pivoting before building specific playbooks." },
  { q: "You were recently hired as a SOC manager at an organization with an existing Google Security Operations (SecOps) implementation. You need to understand the current performance by calculating the mean time to respond or remediate (MTTR) for your cases. What should you do?", opts: ["Create a multi-event detection rule to calculate the response metrics in the outcome section based on the entity graph. Create a dashboard based on these metrics.", "Create a dashboard table widget that displays the average case handling times by analyst, case priority, and environment.", "Create a playbook block that can be re-used in all alert playbooks to write timestamps in the case wall after each change. Write a job to calculate the case metrics.", "Use the playbooks' case stages to capture metrics for each stage change. Create a dashboard based on these metrics."], ans: [1], exp: "A dashboard table widget showing average case handling times by analyst, priority, and environment directly provides the MTTR metrics needed with minimal setup." },
  { q: "You received an IOC from your threat intelligence feed identified as a suspicious domain used for C2. You want to use Google Security Operations (SecOps) to investigate whether this domain appeared in your environment using the most efficient approach. What should you do?", opts: ["Run a raw log search to search for the domain string.", "Configure a UDM search that queries the DNS section of the network noun.", "Enable Group by Field in scan view to cluster events by hostname.", "Enter the IOC into the IOC Search feature, and wait for detections with this domain to appear in the Case view."], ans: [1], exp: "UDM search querying the DNS section of the network noun precisely targets domain lookups across all normalized logs, more efficient than raw search." },
  { q: "You are a senior SOC analyst receiving alerts of traffic to a command and control (C2) IP address. You want to use Google Security Operations (SecOps) to investigate the IP address associated with the C2 IP address. What should you do?", opts: ["Use Google SecOps SOAR Search to run a playbook designed to investigate the suspicious IP address and identify related outbound and inbound traffic.", "Use Google SecOps SOAR Search to identify the cases where the suspicious IP address exists.", "Conduct a Google SecOps SIEM Search that uses src.ip and target.ip to identify outbound and inbound traffic associated with the suspicious IP address.", "Use Google SecOps SIEM Search to query against the grouped ip field, and use the enriched field from the suspicious events to identify related activity."], ans: [2], exp: "Searching UDM using src.ip and target.ip covers both inbound and outbound traffic associated with the C2 IP across all normalized network events." },
  { q: "You are working with your company's analyst team to automate the investigation of phishing alerts ingested directly into Google Security Operations (SecOps) SOAR from an email inbox. The analyst team currently uses a SIEM query to search for related information. You need to design a solution to automatically include the query results in the Google SecOps case without writing any new code. What should you do?", opts: ["Create a custom action in Google SecOps IDE that runs the SIEM query from a playbook through an API call and returns the results.", "Modify the detection rule in the SIEM to include the query results as part of the detection.", "Add a widget to the Default Case View in Google SecOps SOAR that allows the analyst team to query directly from the widget.", "Add an action to the playbook that runs the SIEM query and returns the results."], ans: [3], exp: "Adding a SIEM query action to the playbook automatically runs the query and attaches results to the case, using built-in SOAR-SIEM integration without writing new code." },
  { q: "Your Google Security Operations (SecOps) instance is generating alerts for unusual login times from multiple user accounts. Your SOC analysts are reporting a high number of the alerts are false positives involving service accounts used by scheduled automation tasks. You want to refine the detection logic using entity-level context available in Google SecOps. What is the most effective approach?", opts: ["Use asset tags to group known automation systems, and exclude them from the alert logic.", "Modify the rule to include the principal.user.type != 'service_account' condition.", "Update the rule to only alert when the principal.user.email and principal.user.userid fields match in the same event.", "Add a reference list of all service accounts, and suppress alerts for any matches on the principal.user.email field."], ans: [1], exp: "Using principal.user.type != 'service_account' leverages entity-level UDM context to filter service accounts generically, more maintainable than a reference list requiring constant updates." },

// ── STATE ──────────────────────────────────────────────────────────────────
const state = {
  screen: 'home',       // 'home' | 'domain' | 'quiz' | 'results'
  domainId: null,       // 1-5 for domain screens; null for full mock
  view: 'study',        // 'study' | 'practice' (domain screen tabs)
  // Quiz state
  questions: [],        // active question list (shuffled)
  current: 0,
  answers: [],          // {selected:[], correct:bool} per question
  // Results
  score: 0,
};

// ── HELPERS ────────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function el(id) { return document.getElementById(id); }

function setScreen(html) { el('app').innerHTML = html; }

function navigate(screen, params = {}) {
  Object.assign(state, { screen, ...params });
  render();
}

function render() {
  switch (state.screen) {
    case 'home':    renderHome();           break;
    case 'domain':  renderDomain();         break;
    case 'quiz':    renderQuiz();           break;
    case 'results': renderResults();        break;
  }
}

function renderHome() {
  const cards = DOMAINS.map(d => {
    const count = ALL_QUESTIONS.filter(q => q.domain === d.id).length;
    return `
    <div class="domain-card">
      <div class="domain-num">Domain ${d.id} · ${d.pct}% of exam</div>
      <h3>${d.name}</h3>
      <p class="domain-meta">${count} questions · ${d.desc}</p>
      <div class="card-actions">
        <button class="btn btn-ghost" onclick="navigate('domain',{domainId:${d.id},view:'study'})">📖 Study</button>
        <button class="btn btn-primary" onclick="startQuiz(${d.id})">▶ Practice</button>
      </div>
    </div>`;
  }).join('');

  setScreen(`
    <div class="header">
      <div class="header-left">
        <span class="badge">GPSOE</span>
        <h1>Exam Reviewer</h1>
      </div>
    </div>
    <div class="home-body">
      <div class="home-hero">
        <h2>Google Professional Security Operations Engineer</h2>
        <p>Study by domain, then test yourself. All ${ALL_QUESTIONS.length} official practice questions organized by exam domain.</p>
      </div>
      <div class="domain-grid">${cards}</div>
      <div class="mock-banner">
        <div>
          <h3>Full Mock Exam</h3>
          <p>All ${ALL_QUESTIONS.length} questions in random order · Simulates real exam conditions</p>
        </div>
        <button class="btn btn-green" onclick="startQuiz(null)">Start Full Exam →</button>
      </div>
    </div>`);
}

function prepareQuestions(domainId) {
  const pool = domainId
    ? ALL_QUESTIONS.filter(q => q.domain === domainId)
    : [...ALL_QUESTIONS];
  return shuffle(pool).map(q => {
    const indices = q.opts.map((_, i) => i);
    const shuffled = shuffle(indices);
    return { ...q, opts: shuffled.map(i => q.opts[i]), ans: q.ans.map(a => shuffled.indexOf(a)) };
  });
}

function startQuiz(domainId) {
  const questions = prepareQuestions(domainId);
  navigate('quiz', {
    domainId,
    questions,
    current: 0,
    answers: new Array(questions.length).fill(null).map(() => ({ selected: [], submitted: false, correct: false })),
    score: 0,
  });
}

// ── DOMAIN SCREEN ──────────────────────────────────────────────────────────
function renderDomain() {
  const d = DOMAINS.find(x => x.id === state.domainId);
  const count = ALL_QUESTIONS.filter(q => q.domain === d.id).length;
  const studyContent = state.view === 'study' ? renderStudy() : renderPracticeTab(d, count);

  setScreen(`
    <div class="header">
      <div class="header-left">
        <button class="header-back" onclick="navigate('home')">← Home</button>
        <span class="badge">Domain ${d.id}</span>
        <h1>${d.name}</h1>
      </div>
    </div>
    <div class="domain-body">
      <div class="tabs">
        <button class="tab-btn ${state.view==='study'?'active':''}"
          onclick="navigate('domain',{domainId:state.domainId,view:'study'})">📖 Study</button>
        <button class="tab-btn ${state.view==='practice'?'active':''}"
          onclick="navigate('domain',{domainId:state.domainId,view:'practice'})">▶ Practice</button>
      </div>
      ${studyContent}
    </div>`);
}

function renderStudy() {
  const lesson = LESSONS[state.domainId];

  const concepts = lesson.concepts.map(c =>
    `<li><strong>${c.term}:</strong> ${c.detail}</li>`
  ).join('');

  const patterns = lesson.patterns.map(p =>
    `<li>
      <span class="trigger">When asked: <em>${p.trigger}</em></span><br>
      → <span class="answer">${p.answer}</span><br>
      <span style="color:var(--text-muted);font-size:12.5px">Because: ${p.reason}</span>
    </li>`
  ).join('');

  const refs = lesson.refs.map(r =>
    `<div class="ref-item">${r}</div>`
  ).join('');

  const count = ALL_QUESTIONS.filter(q => q.domain === state.domainId).length;

  return `
    <div class="lesson-section">
      <h3>📚 Key Concepts</h3>
      <ul class="concept-list">${concepts}</ul>
    </div>
    <div class="lesson-section">
      <h3>💡 Key Patterns (Exam Tips)</h3>
      <ul class="pattern-list">${patterns}</ul>
    </div>
    <div class="lesson-section">
      <h3>⚡ Quick Reference</h3>
      <div class="ref-grid">${refs}</div>
    </div>
    <div class="lesson-start-btn">
      <button class="btn btn-primary" onclick="startQuiz(${state.domainId})" style="width:100%;padding:14px;font-size:15px">
        Ready? Start ${count}-Question Practice →
      </button>
    </div>`;
}

function renderPracticeTab(d, count) {
  return `
    <div style="text-align:center;padding:40px 0">
      <h3 style="font-size:20px;margin-bottom:10px">${count} Questions</h3>
      <p style="color:var(--text-muted);margin-bottom:28px;font-size:14px">
        Questions are shuffled each session. Answer each question, then see the explanation immediately.
      </p>
      <button class="btn btn-primary" onclick="startQuiz(${d.id})" style="padding:14px 32px;font-size:15px">
        Start Practice →
      </button>
      <div style="margin-top:20px">
        <button class="btn btn-ghost" onclick="navigate('domain',{domainId:${d.id},view:'study'})" style="font-size:13px">
          ← Review Lesson First
        </button>
      </div>
    </div>`;
}

// ── QUIZ ENGINE ────────────────────────────────────────────────────────────
function renderQuiz() {
  const { questions, current, answers } = state;
  const q = questions[current];
  const ans = answers[current];

  // Sidebar dots
  const dots = questions.map((_, i) => {
    let cls = i === current ? 'active' : '';
    if (answers[i].submitted) cls = answers[i].correct ? 'correct' : 'wrong';
    return `<div class="q-dot ${cls}" onclick="jumpTo(${i})">${i+1}</div>`;
  }).join('');

  const correct = answers.filter(a => a.submitted && a.correct).length;
  const wrong   = answers.filter(a => a.submitted && !a.correct).length;
  const remain  = questions.length - answers.filter(a => a.submitted).length;
  const pct     = Math.round((answers.filter(a=>a.submitted).length / questions.length) * 100);

  // Options HTML
  let optCls = (i) => {
    if (!ans.submitted) return ans.selected.includes(i) ? 'selected' : '';
    if (q.ans.includes(i)) return 'correct-ans';
    if (ans.selected.includes(i) && !q.ans.includes(i)) return 'wrong-ans';
    return '';
  };

  const opts = q.opts.map((text, i) => `
    <button class="opt ${optCls(i)}" onclick="selectOption(${i})" ${ans.submitted ? 'disabled' : ''}>
      <span class="opt-letter">${String.fromCharCode(65+i)}</span>
      <span class="opt-text">${text}</span>
    </button>`).join('');

  // Feedback
  let feedback = '';
  if (ans.submitted) {
    const correct_ans = q.ans.map(a => String.fromCharCode(65+a)).join(', ');
    feedback = `<div class="feedback-box ${ans.correct ? 'correct' : 'wrong'}">
      <strong>${ans.correct ? '✓ Correct' : `✗ Correct answer: ${correct_ans}`}</strong><br>${q.exp}
    </div>`;
  }

  // Action buttons
  const canSubmit = ans.selected.length > 0 && !ans.submitted;
  const isLast    = current === questions.length - 1;
  const actions = ans.submitted
    ? `<button class="btn btn-primary" onclick="${isLast ? 'showResults()' : 'nextQuestion()'}">${isLast ? 'View Results' : 'Next →'}</button>
       ${current > 0 ? '<button class="btn btn-ghost" onclick="prevQuestion()">← Prev</button>' : ''}`
    : `<button class="btn btn-primary" onclick="submitAnswer()" ${canSubmit ? '' : 'disabled'}>Submit</button>
       ${current > 0 ? '<button class="btn btn-ghost" onclick="prevQuestion()">← Prev</button>' : ''}`;

  const domainLabel = state.domainId
    ? `Domain ${state.domainId} Practice`
    : 'Full Mock Exam';

  setScreen(`
    <div class="header">
      <div class="header-left">
        <button class="header-back" onclick="confirmExit()">← Exit</button>
        <span class="badge">GPSOE</span>
        <h1>${domainLabel}</h1>
      </div>
      <span style="font-size:13px;color:var(--text-muted)">${current+1} / ${questions.length}</span>
    </div>
    <div class="quiz-layout">
      <div class="quiz-sidebar">
        <div class="sidebar-header">
          <div class="progress-label"><span>Progress</span><span>${pct}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="stats-row">
            <div class="stat correct"><div class="num">${correct}</div><div class="lbl">Correct</div></div>
            <div class="stat wrong"><div class="num">${wrong}</div><div class="lbl">Wrong</div></div>
            <div class="stat remain"><div class="num">${remain}</div><div class="lbl">Left</div></div>
          </div>
        </div>
        <div class="q-grid">${dots}</div>
      </div>
      <div class="quiz-main">
        <div class="q-meta">
          <span class="q-num">Q${current+1}</span>
          ${q.multi ? '<span class="multi-tag">Choose 2</span>' : ''}
        </div>
        <div class="q-text">${q.q}</div>
        <div class="options">${opts}</div>
        ${feedback}
        <div class="quiz-actions">${actions}</div>
      </div>
    </div>`);
}

function selectOption(i) {
  const { questions, current, answers } = state;
  if (answers[current].submitted) return;
  const q = questions[current];
  const sel = answers[current].selected;

  if (q.multi) {
    // Toggle multi-select (max 2)
    const idx = sel.indexOf(i);
    if (idx === -1 && sel.length < q.ans.length) sel.push(i);
    else if (idx !== -1) sel.splice(idx, 1);
  } else {
    answers[current].selected = [i];
  }
  renderQuiz();
}

function submitAnswer() {
  const { questions, current, answers } = state;
  const q   = questions[current];
  const ans = answers[current];
  if (!ans.selected.length || ans.submitted) return;

  ans.submitted = true;
  const sortedSel = [...ans.selected].sort();
  const sortedAns = [...q.ans].sort();
  ans.correct = sortedSel.length === sortedAns.length &&
    sortedSel.every((v, i) => v === sortedAns[i]);
  if (ans.correct) state.score++;
  renderQuiz();
}

function nextQuestion() {
  if (state.current < state.questions.length - 1) {
    state.current++;
    renderQuiz();
  }
}

function prevQuestion() {
  if (state.current > 0) {
    state.current--;
    renderQuiz();
  }
}

function jumpTo(i) {
  state.current = i;
  renderQuiz();
}

function confirmExit() {
  if (confirm('Exit quiz? Your progress will be lost.')) {
    state.domainId
      ? navigate('domain', { domainId: state.domainId, view: 'practice' })
      : navigate('home');
  }
}

function showResults() {
  navigate('results');
}

// ── RESULTS SCREEN ─────────────────────────────────────────────────────────
function renderResults() {
  const { questions, answers, score, domainId } = state;
  const total   = questions.length;
  const wrong   = answers.filter(a => a.submitted && !a.correct).length;
  const skipped = answers.filter(a => !a.submitted).length;
  const pct     = Math.round((score / total) * 100);
  const pass    = pct >= 70;
  const label   = domainId ? DOMAINS.find(d=>d.id===domainId).name : 'Full Mock Exam';

  setScreen(`
    <div class="header">
      <div class="header-left">
        <span class="badge">GPSOE</span>
        <h1>Results</h1>
      </div>
    </div>
    <div class="results-body">
      <h2>${label}</h2>
      <p class="sub">${total} questions · ${pass ? 'Great work!' : 'Keep studying — you\'ve got this.'}</p>
      <div class="score-circle ${pass?'pass':'fail'}">
        <div class="score-pct">${pct}%</div>
        <div class="score-lbl">Score</div>
      </div>
      <div class="verdict ${pass?'pass':'fail'}">${pass ? '✓ Pass (≥70%)' : '✗ Below passing (70%)'}</div>
      <div class="results-grid">
        <div class="res-card c"><div class="big">${score}</div><div class="sml">Correct</div></div>
        <div class="res-card w"><div class="big">${wrong}</div><div class="sml">Wrong</div></div>
        <div class="res-card"><div class="big" style="color:var(--yellow)">${skipped}</div><div class="sml">Skipped</div></div>
      </div>
      <div class="results-actions">
        <button class="btn btn-primary" onclick="startQuiz(${domainId})">Retry →</button>
        ${domainId
          ? `<button class="btn btn-ghost" onclick="navigate('domain',{domainId:${domainId},view:'study'})">← Review Lesson</button>`
          : ''}
        <button class="btn btn-ghost" onclick="navigate('home')">Home</button>
      </div>
    </div>`);
}

// ── INIT ───────────────────────────────────────────────────────────────────
render();
</script>
