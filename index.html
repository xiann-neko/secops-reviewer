<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPSOE Exam Reviewer</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1117; --surface: #1a1d27; --card: #21253a;
  --border: #2e3350; --border-light: #3d4370;
  --accent: #4f7cff; --accent-hover: #6b93ff;
  --green: #22c55e; --green-bg: #0d2818; --green-border: #166534;
  --red: #f87171; --red-bg: #2d0f0f; --red-border: #7f1d1d;
  --yellow: #fbbf24;
  --text: #e8eaf6; --text-muted: #8b92b8; --text-dim: #5a6080;
  --radius: 10px; --radius-sm: 6px;
}
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.6; min-height: 100vh; }

/* ── Shared ── */
.btn { padding: 10px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: opacity .15s, transform .1s; font-family: inherit; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-green  { background: var(--green); color: #fff; }
.btn-green:hover { opacity: .9; }
.btn-ghost  { background: var(--card); border: 1.5px solid var(--border); color: var(--text-muted); }
.btn-ghost:hover { border-color: var(--border-light); color: var(--text); }
.badge { background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
.screen { display: none; }
.screen.active { display: block; }

/* ── Header ── */
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 100; }
.header-left { display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 15px; font-weight: 600; }
.header-back { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; font-family: inherit; padding: 6px 12px; border-radius: var(--radius-sm); }
.header-back:hover { background: var(--card); color: var(--text); }

/* ── Home screen ── */
.home-body { max-width: 900px; margin: 0 auto; padding: 40px 24px; }
.home-hero { text-align: center; margin-bottom: 48px; }
.home-hero h2 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
.home-hero p  { color: var(--text-muted); font-size: 15px; max-width: 560px; margin: 0 auto 24px; }
.domain-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-bottom: 32px; }
.domain-card { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 12px; transition: border-color .15s; }
.domain-card:hover { border-color: var(--border-light); }
.domain-card .domain-num { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
.domain-card h3 { font-size: 15px; font-weight: 600; line-height: 1.4; }
.domain-card .domain-meta { font-size: 12px; color: var(--text-muted); }
.domain-card .card-actions { display: flex; gap: 8px; margin-top: 4px; }
.card-actions .btn { font-size: 13px; padding: 8px 14px; }
.mock-banner { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.mock-banner div h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.mock-banner div p  { font-size: 13px; color: var(--text-muted); }

/* ── Domain screen (Study/Practice tabs) ── */
.domain-body { max-width: 820px; margin: 0 auto; padding: 32px 24px; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px; width: fit-content; margin-bottom: 28px; }
.tab-btn { padding: 8px 20px; border-radius: 4px; font-size: 14px; font-weight: 500; border: none; background: none; color: var(--text-muted); cursor: pointer; font-family: inherit; transition: background .15s, color .15s; }
.tab-btn.active { background: var(--card); color: var(--text); font-weight: 600; }

/* ── Study / Lesson view ── */
.lesson-section { margin-bottom: 32px; }
.lesson-section h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); color: var(--accent); }
.concept-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.concept-list li { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13.5px; line-height: 1.6; }
.concept-list li strong { color: var(--text); }
.pattern-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.pattern-list li { background: var(--surface); border-left: 3px solid var(--accent); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 10px 14px; font-size: 13.5px; line-height: 1.6; }
.pattern-list li .trigger { color: var(--text-muted); }
.pattern-list li .answer  { color: var(--green); font-weight: 600; }
.ref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.ref-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12.5px; font-family: 'Consolas', monospace; color: var(--yellow); line-height: 1.7; }
.lesson-start-btn { margin-top: 8px; }

/* ── Quiz engine ── */
.quiz-layout  { display: flex; height: calc(100vh - 56px); overflow: hidden; }
.quiz-sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.sidebar-header { padding: 14px; border-bottom: 1px solid var(--border); }
.progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.progress-bar  { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s ease; }
.stats-row { display: flex; gap: 6px; margin-top: 10px; }
.stat { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px; text-align: center; }
.stat .num { font-size: 16px; font-weight: 700; }
.stat .lbl { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
.stat.correct .num { color: var(--green); }
.stat.wrong   .num { color: var(--red); }
.stat.remain  .num { color: var(--accent); }
.q-grid  { flex: 1; overflow-y: auto; padding: 10px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; align-content: start; }
.q-dot   { aspect-ratio: 1; border-radius: 4px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; color: var(--text-dim); cursor: pointer; transition: all .15s; user-select: none; }
.q-dot:hover   { border-color: var(--accent); color: var(--accent); }
.q-dot.active  { border-color: var(--accent); background: rgba(79,124,255,.15); color: var(--accent); }
.q-dot.correct { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }
.q-dot.wrong   { background: var(--red-bg); border-color: var(--red-border); color: var(--red); }
.quiz-main { flex: 1; overflow-y: auto; padding: 32px 40px; display: flex; flex-direction: column; gap: 20px; }
.q-meta  { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-muted); }
.q-num   { background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
.multi-tag { background: rgba(251,191,36,.15); color: var(--yellow); border: 1px solid rgba(251,191,36,.3); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.q-text  { font-size: 16px; font-weight: 500; line-height: 1.65; max-width: 700px; }
.options { display: flex; flex-direction: column; gap: 10px; max-width: 700px; }
.opt     { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 13px 16px; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; transition: border-color .15s, background .15s; text-align: left; width: 100%; color: var(--text); font-size: 14px; line-height: 1.55; font-family: inherit; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: rgba(79,124,255,.06); }
.opt:disabled { cursor: default; }
.opt-letter { width: 24px; height: 24px; border-radius: 50%; background: var(--border); color: var(--text-muted); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.opt.selected .opt-letter { background: var(--accent); color: #fff; }
.opt.selected { border-color: var(--accent); background: rgba(79,124,255,.1); }
.opt.correct-ans { border-color: var(--green) !important; background: var(--green-bg) !important; }
.opt.correct-ans .opt-letter { background: var(--green); color: #fff; }
.opt.wrong-ans   { border-color: var(--red) !important; background: var(--red-bg) !important; }
.opt.wrong-ans   .opt-letter { background: var(--red); color: #fff; }
.feedback-box { max-width: 700px; border-radius: var(--radius); padding: 14px 16px; font-size: 13.5px; line-height: 1.6; }
.feedback-box.correct { background: var(--green-bg); border: 1px solid var(--green-border); color: #86efac; }
.feedback-box.wrong   { background: var(--red-bg);   border: 1px solid var(--red-border);   color: #fca5a5; }
.quiz-actions { display: flex; gap: 10px; max-width: 700px; }

/* ── Results screen ── */
.results-body { max-width: 640px; margin: 0 auto; padding: 48px 24px; text-align: center; }
.results-body h2 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
.results-body .sub { color: var(--text-muted); margin-bottom: 32px; }
.score-circle { width: 150px; height: 150px; border-radius: 50%; border: 6px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 28px; }
.score-circle.pass { border-color: var(--green); box-shadow: 0 0 40px rgba(34,197,94,.2); }
.score-circle.fail { border-color: var(--red);   box-shadow: 0 0 40px rgba(248,113,113,.15); }
.score-pct  { font-size: 38px; font-weight: 800; }
.score-circle.pass .score-pct { color: var(--green); }
.score-circle.fail .score-pct { color: var(--red); }
.score-lbl  { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
.verdict    { font-size: 17px; font-weight: 700; margin-bottom: 28px; }
.verdict.pass { color: var(--green); }
.verdict.fail { color: var(--red); }
.results-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 28px; }
.res-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.res-card .big { font-size: 26px; font-weight: 700; }
.res-card .sml { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }
.res-card.c .big { color: var(--green); }
.res-card.w .big { color: var(--red); }
.results-actions { display: flex; gap: 10px; justify-content: center; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// Domain index map (0-based question index → domain 1-5)
const DOMAIN_MAP = {
  // Domain 1 – Configuring the Environment
  7:1, 11:1, 18:1, 25:1, 26:1, 40:1, 44:1, 52:1, 55:1, 57:1,
  59:1, 65:1, 74:1, 78:1, 79:1, 81:1, 82:1, 83:1, 90:1,
  100:1, 101:1, 102:1, 106:1, 110:1, 113:1, 115:1, 124:1, 128:1, 130:1,
  // Domain 2 – Managing & Configuring Security Telemetry
  3:2, 12:2, 16:2, 62:2, 71:2, 89:2, 99:2, 104:2, 118:2,
  // Domain 3 – Ensuring Ongoing & Effective Detection
  0:3, 2:3, 4:3, 8:3, 13:3, 15:3, 17:3, 19:3, 20:3, 22:3, 24:3,
  33:3, 34:3, 35:3, 38:3, 39:3, 41:3, 50:3, 51:3, 60:3, 64:3,
  66:3, 70:3, 80:3, 91:3, 92:3, 93:3, 94:3, 95:3, 96:3,
  105:3, 112:3, 122:3, 123:3, 127:3,
  // Domain 4 – Investigating Security Incidents
  6:4, 9:4, 21:4, 23:4, 27:4, 30:4, 31:4, 32:4, 37:4, 43:4,
  46:4, 49:4, 58:4, 63:4, 68:4, 76:4, 85:4, 88:4, 97:4,
  108:4, 111:4, 116:4, 119:4, 120:4, 125:4,
  // Domain 5 – Responding to Security Incidents
  1:5, 5:5, 10:5, 14:5, 28:5, 29:5, 36:5, 42:5, 45:5, 47:5, 48:5,
  53:5, 54:5, 56:5, 61:5, 67:5, 69:5, 72:5, 73:5, 75:5, 77:5,
  84:5, 86:5, 87:5, 98:5, 103:5, 107:5, 109:5, 114:5, 117:5,
  121:5, 126:5, 129:5
};

const ALL_QUESTIONS = [
  { q: "You are responsible for identifying suspicious activity and security events at your organization. You have been asked to search in Google Security Operations (SecOps) for network traffic associated with an active HTTP backdoor that runs on TCP port 5555. You want to use the most effective approach to identify traffic originating from the server that is running the backdoor. What should you do?", opts: ["Detect on events where network.ApplicationProtocol is HTTP.", "Detect on events where target.port is 5555.", "Detect on events where principal.port is 5555.", "Detect on events where network.ip_protocol is TCP."], ans: [2], exp: "principal.port identifies the source port. Traffic FROM the backdoor server will have port 5555 as the principal (source) port. target.port identifies destinations." },
  { q: "You are an incident responder at your organization using Google Security Operations (SecOps). You discover that a critical production server shows signs of unauthorized file changes and network scanning from a suspicious IP address. You suspect that persistence mechanisms may have been installed. You need to use Google SecOps to immediately contain the threat while ensuring that forensic data remains available for investigation. What should you do first?", opts: ["Use the firewall integration to submit the IP address to a network block list.", "Deploy emergency patches, and reboot the server to remove malicious persistence.", "Use the EDR integration to quarantine the compromised asset.", "Use VirusTotal to enrich the IP address and retrieve the domain. Add the domain to the proxy block list."], ans: [2], exp: "Using the EDR integration to quarantine isolates the asset from the network while preserving volatile memory and forensic artifacts. Rebooting destroys forensic evidence." },
  { q: "Your organization uses Google Security Operations (SecOps). You discover frequent file downloads from a shared workspace within a short time window. You need to configure a rule in Google SecOps that identifies these suspicious events and assigns higher risk scores to repeated anomalies. What should you do?", opts: ["Configure a rule that flags file download events with the highest risk score, regardless of time frame.", "Create a frequency-based YARA-L detection rule that assigns a risk outcome score and is triggered when multiple suspicious downloads occur within a defined time frame.", "Configure a single-event YARA-L detection rule that assigns a risk outcome score and is triggered when a user downloads a large number of files in 24 hours.", "Enable default curated detections, and use automatic alerting for single file download events."], ans: [1], exp: "A frequency-based (multi-event) YARA-L rule with a defined time window and outcome risk score is the correct approach for detecting anomalous download volume patterns." },
  { q: "You are implementing Google Security Operations (SecOps) at your organization. You discover that the current detection rules are too noisy. You want to ingest additional context sources to reduce false positives and improve the overall positive ratio of the alerts. What should you do?", opts: ["Ingest high-value asset (HVA) data from your configuration management database (CMDB) system to increase the priority of the alerts based on asset sensitivity.", "Ingest dark web forum handlers from your threat intelligence system to match dark web principals within detection rules.", "Ingest IOCs from your threat intelligence system to validate the IP addresses, domains and hashes with detection rules.", "Ingest tactics, techniques, and procedures (TTPs) from your threat intelligence system to validate processes and tools with detection rules."], ans: [0], exp: "Ingesting HVA/CMDB data adds asset sensitivity context that helps prioritize and filter alerts, reducing false positives by focusing on assets that actually matter." },
  { q: "You are developing a new detection rule in Google Security Operations (SecOps) with complex event, match, and condition sections. You need to develop and test the rule before migrating to production, minimizing impact. What should you do?", opts: ["Develop the rule logic in the UDM search, review the search output to inform changes to filters and logic, and copy the rule into the Rules Editor.", "Use Gemini in Google SecOps to develop the rule by providing a description of the parameters and conditions, and transfer the rule into the Rules Editor.", "Develop the rule in the Rules Editor, define the sections the rule logic, and test the rule using the test rule feature.", "Develop the rule in the Rules Editor, define the sections of the rule logic, and test the rule by setting it to live but not alerting. Run a YARA-L retrohunt from the rules dashboard."], ans: [0], exp: "Using UDM search first lets you iteratively refine logic against real data without touching production rules infrastructure, minimizing production impact." },
  { q: "Your organization has recently acquired Company A. You need to enable Company A's analysts to work cases in Google SecOps without accessing outside data, while being able to re-purpose your playbooks. You need to minimize effort. What is the first step?", opts: ["Acquire a second Google SecOps SOAR tenant for Company A.", "Provision a new service account for Company A.", "Define a new SOC role for Company A.", "Create a Google SecOps SOAR environment for Company A."], ans: [3], exp: "Creating a separate SOAR environment provides logical case isolation while allowing playbook reuse within the same tenant." },
  { q: "You have identified and isolated a new malware sample you believe was developed specifically for an attack against your organization. You want to quickly analyze this malware to get IOCs without alerting the threat group. What should you do?", opts: ["Search for the threat group in Google Threat Intelligence.", "Upload the malware to Google Threat Intelligence by using VirusTotal.", "Upload the malware to Google Threat Intelligence by using Private Scanning.", "Calculate the file checksum for the malware, and search for the checksum in Google Threat Intelligence by using VirusTotal."], ans: [2], exp: "Private Scanning analyzes malware without sharing it publicly (unlike VirusTotal), preventing the threat group from detecting that their sample has been discovered." },
  { q: "Your organization uses Cloud Identity as their IdP and is a Google Security Operations (SecOps) customer. You need to grant a group of users read-only access to all resources, including detection engine rules. How should this be configured?", opts: ["Create a Google Group and add the required users. Grant the roles/chronicle.Viewer IAM role to the group on the project associated with your Google SecOps instance.", "Create a Google Group and add the required users. Grant the roles/chronicle.limitedViewer IAM role to the group on the project associated with your Google SecOps instance.", "Create a workforce identity pool at the organization level. Grant the roles/chronicle.editor IAM role to the principalSet on the project.", "Create a workforce identity pool at the organization level. Grant the roles/chronicle.limitedViewer IAM role to the principalSet on the project."], ans: [0], exp: "roles/chronicle.Viewer provides read-only access to all resources including detection rules. limitedViewer excludes detection rules." },
  { q: "Your team has been tasked with identifying unknown command and control nodes (C2s) potentially active in your environment. You need to generate a list of potential matches within the next 24 hours. What should you do?", opts: ["Write a rule in Google Security Operations (SecOps) that scans historic network outbound connections against ingested threat intelligence. Run the rule in a retrohunt against the full tenant.", "Load network records into BigQuery to identify endpoints communicating with domains outside three standard deviations of normal.", "Review Security Health Analytics (SHA) findings in Security Command Center (SCC).", "Write a YARA-L rule in Google Security Operations (SecOps) that compares network traffic of endpoints to low prevalence domains against recent WHOIS registrations."], ans: [0], exp: "Running a retrohunt with a rule matching outbound connections against ingested threat intelligence is the fastest approach to identify potential C2 matches within 24 hours." },
  { q: "You received an alert from Container Threat Detection that an added binary has been executed in a business critical workload. You need to investigate and respond to this incident. What should you do? (Choose two.)", opts: ["Notify the workload owner. Follow the response playbook, and ask the threat hunting team to identify the root cause of the incident.", "Review the finding, investigate the pod and related resources, and research the related attack and response methods.", "Review the finding, quarantine the cluster containing the running pod, and delete the running pod to prevent further compromise.", "Silence the alert in the Security Command Center (SCC) console, as the alert is a low severity finding.", "Keep the cluster and pod running, and investigate the behavior to determine whether the activity is malicious."], ans: [0, 1], exp: "A and B: Notifying the owner and following the playbook while researching attack methods is the correct investigative approach. Deleting the pod destroys forensic evidence.", multi: true },
  { q: "Security analysts navigate to the Playbooks tab for each alert and manually run steps assigned to a user. You need to present all actions from alerts awaiting user input in one location for the analyst to execute. What should you do?", opts: ["Enable approval links in the manual action and display them as clickable links to the user in a HTML widget in the Default Case View tab.", "Add a general insight in your playbook to display manual action details to the user.", "Use the Pending Actions widget in the Default Case View in settings.", "Create an Alert View with the playbook that incorporates the Pending Actions widget."], ans: [2], exp: "The Pending Actions widget in the Default Case View consolidates all manual actions awaiting user input in one centralized location." },
  { q: "You are managing a Google Security Operations (SecOps) implementation. Your customer informs you that logs are appearing in the platform after a consistent six-hour delay due to a log time zone issue. You want to fix this problem. What should you do?", opts: ["Modify the default parser and include a default time zone.", "Create a parser extension to correct the time zone.", "Create a custom parser to correct the time zone.", "Modify the UI settings to correct the time zone."], ans: [1], exp: "A parser extension is the least-effort approach to add time zone correction on top of an existing parser without replacing it entirely." },
  { q: "Your organization uses Google Security Operations (SecOps). You need to identify the most commonly occurring processes and applications across your organization's large number of servers to implement baselines and exclusion lists. You want to use the most efficient approach. What should you do?", opts: ["Use the UDM lookup feature to identify relevant process-related UDM fields and values.", "Run a UDM search, and review aggregations for relevant process-related UDM fields.", "Review the Google SecOps SIEM Rules & Detections, and identify the most common processes appearing in alerts marked as false positives.", "Generate a Google SecOps SIEM dashboard based on relevant UDM fields that provides the counts for process names and files."], ans: [1], exp: "UDM search with aggregations provides the fastest, most efficient way to summarize process frequency across many events without building dashboards first." },
  { q: "You work for an organization that uses Security Command Center (SCC) with Event Threat Detection (ETD) enabled. You need to enable ETD detections for data exfiltration attempts from designated sensitive Cloud Storage buckets and BigQuery datasets. You want to minimize Cloud Logging costs. What should you do?", opts: ["Enable 'data read' audit logs only for the designated sensitive Cloud Storage buckets and BigQuery datasets.", "Enable 'data read' and 'data write' audit logs only for the designated sensitive Cloud Storage buckets and BigQuery datasets.", "Enable 'data read' and 'data write' audit logs for all Cloud Storage buckets and BigQuery datasets throughout the organization.", "Enable VPC Flow Logs for the VPC networks containing resources that access the sensitive Cloud Storage buckets and BigQuery datasets."], ans: [0], exp: "Enabling only 'data read' audit logs on specific sensitive resources provides ETD the telemetry it needs for exfiltration detection at minimum cost." },
  { q: "Last week, an attacker attempted to establish persistence by generating a key for an unused service account. You need to confirm you are receiving alerts when keys are created for unused service accounts and that newly created keys are automatically deleted. You want to minimize manual effort. What should you do?", opts: ["Generate a YARA-L rule in Google SecOps that detects when a service account key is created. Using the built-in IDE, create a custom action in Google SecOps SOAR that deletes the service account key.", "Use the Initial Access: Dormant Service Account Key Created finding from SCC, and ingest this finding into Google SecOps. Create a custom action in Google SecOps SOAR that is triggered on this finding. Use the built-in IDE to build code to delete the service account key.", "Configure a Cloud Logging sink to write logs to a Pub/Sub topic filtering for the CreateServiceAccountKey method. Create a Cloud Run function that subscribes to the Pub/Sub topic and deletes the service account key.", "Use the Initial Access: Dormant Service Account Key Created finding from SCC, and write this finding to a Pub/Sub topic. Create a Cloud Run function that subscribes to the Pub/Sub topic and deletes the service account key."], ans: [1], exp: "Using the built-in SCC finding with SOAR automation leverages existing detectors and the integrated IDE for response, minimizing manual effort." },
  { q: "Your company recently adopted Security Command Center (SCC) but is not using Google Security Operations (SecOps). You need to detect anomalous behavior by windowing and aggregating data over a given time period. You also need to provide an interface for analysts to triage the alerts. How should you build this capability?", opts: ["Send the logs to Cloud SQL, and run a scheduled query against these events using a Cloud Run scheduled job.", "Sink the logs to BigQuery, and configure Cloud Run functions to execute a periodic job and generate normalized alerts in a Pub/Sub topic for findings. Use log-based metrics to generate event-driven alerts and send to the Pub/Sub topic. Write the alerts as findings using the SCC API.", "Use log-based metrics to generate event-driven alerts for the detection scenarios. Configure a Cloud Monitoring alert policy to send email alerts to your security operations team.", "Create a series of aggregated log sinks for each required finding, and send the normalized findings as JSON files to Cloud Storage."], ans: [1], exp: "BigQuery enables windowed aggregation queries; Cloud Run handles scheduling; writing findings to SCC via API provides the analyst triage interface." },
  { q: "Your organization is a Google Security Operations (SecOps) customer and monitors critical assets using a SIEM dashboard. You need to dynamically monitor the assets based on a specific asset tag. What should you do?", opts: ["Ask Cloud Customer Care to add a custom filter to the dashboard.", "Add a custom filter to the dashboard.", "Copy an existing dashboard and add a custom filter.", "Export the dashboard configuration to a file, modify the file to add a custom filter, and import the file into Google SecOps."], ans: [1], exp: "Google SecOps supports adding custom filters directly to dashboards. No need to copy, export, or contact support." },
  { q: "A business unit in your organization plans to use Vertex AI to develop models within Google Cloud. The security team needs to implement detective and preventative guardrails to ensure the environment meets internal security control requirements. How should you secure this environment?", opts: ["Implement Assured Workloads by creating a folder for the business unit and assigning the relevant control package.", "Implement preconfigured and custom organization policies to meet the control requirements. Apply these policies to the business unit folder.", "Create a policy bundle representing the control requirements using Rego. Implement these policies using Workload Manager. Scope this scan to the business unit folder.", "Create a posture consisting of predefined and custom organization policies and predefined and Security Health Analytics (SHA) custom modules. Scope this posture to the business unit folder."], ans: [3], exp: "SCC postures combine org policies (preventative) and SHA modules (detective) in one scoped deployment, the comprehensive approach for both guardrail types." },
  { q: "You are implementing Google Security Operations (SecOps) with multiple log sources. You want to closely monitor the health of the ingestion pipeline's forwarders and collection agents, and detect silent sources within five minutes. What should you do?", opts: ["Create a notification in Cloud Monitoring using a metric-absence condition based on sample policy for each collector_id.", "Create a Google SecOps SIEM dashboard to show the ingestion metrics for each log_type and collector_id.", "Create an ingestion notification for health metrics in Cloud Monitoring based on the total ingested log count for each collector_id.", "Create a Looker dashboard that queries the BigQuery ingestion metrics schema for each log_type and collector_id."], ans: [0], exp: "A metric-absence condition in Cloud Monitoring triggers when metrics stop appearing, exactly what is needed to detect silent sources within a specified time window." },
  { q: "A Google Security Operations (SecOps) detection rule is generating frequent false positive alerts when the storage.objects.list API is called. A legitimate backup automation tool uses the same API. You need to reduce false positives from this trusted backup tool while still detecting potentially malicious usage. How should you modify the rule?", opts: ["Add principal.user.email != 'backup-bot@foobaa.com' to the rule condition to exclude the automation account.", "Replace api.operation with api.service_name = 'storage.googleapis.com' to narrow the detection scope.", "Convert the rule into a multi-event rule that looks for repeated API calls across multiple buckets.", "Adjust the rule severity to LOW to deprioritize alerts from automation tools."], ans: [0], exp: "Excluding the specific automation service account email from the condition precisely reduces false positives while preserving detection for all other principals." },
  { q: "Your company uses Google Security Operations (SecOps) Enterprise and is ingesting various logs. You need to proactively identify potentially compromised user accounts by detecting when a user downloads an unusually large volume of data compared to their established baseline. You want to detect this using the least amount of effort. What should you do?", opts: ["Inspect Security Command Center (SCC) default findings for data exfiltration in Google SecOps.", "Create a log-based metric in Cloud Monitoring, and configure an alert to trigger if the data downloaded per user exceeds a predefined limit.", "Develop a custom YARA-L detection rule in Google SecOps that counts download bytes per user per hour and triggers an alert if a threshold is exceeded.", "Enable curated detection rules for User and Endpoint Behavioral Analytics (UEBA), and use the Risk Analytics dashboard in Google SecOps to identify metrics associated with the anomalous activity."], ans: [3], exp: "UEBA curated detections are purpose-built for baseline behavioral analysis. Enabling them with the Risk Analytics dashboard requires minimal effort." },
  { q: "Your organization uses Security Command Center (SCC) and relies on Compute Engine instances to run business-critical workloads. SCC has flagged a particular instance for exhibiting a high volume of outbound network connections to geographically diverse and unknown IP addresses. You need to determine whether the instance has been compromised by malware. What should you do?", opts: ["Examine the IAM roles assigned to the service account associated with the instance. Revoke any permissions that could have facilitated malware installation.", "Review the Google Cloud Service Health dashboard to identify any ongoing Google Cloud platform incidents.", "Disable and re-enable the instance's network interface and determine whether the unusual network behavior is resolved.", "Analyze Event Threat Detection findings. Review the events and the outbound network connections associated with the instance."], ans: [3], exp: "Event Threat Detection findings and associated network connection logs provide direct evidence of malicious activity and the investigation context needed." },
  { q: "Your company wants to enhance its detection capabilities to prevent insider threat incidents. You need to be alerted when a privileged Google Group is modified to allow access to the general public. What should you do?", opts: ["Enable Google Drive log events. Create a reporting rule that triggers when a file sharing event occurs with the visibility set to anyone with the link.", "Enable VPC Flow Logs for the default VPC network. Configure a log-based alert in Cloud Logging.", "Enable IAM Admin Activity audit logs, and export the logs to Google Security Operations (SecOps). Write a YARA-L rule to capture any changes to relevant IAM policies.", "Enable data sharing for Google Workspace Admin Audit logs, and ensure that Event Threat Detection is enabled for your organization."], ans: [3], exp: "Google Workspace Admin Audit logs capture group modification events, and ETD provides built-in detection for Group Open Access changes." },
  { q: "You are using Google Security Operations (SecOps) to investigate suspicious activity linked to a specific user. You want to identify all assets the user has interacted with over the past seven days to assess potential impact. How should you identify user-to-asset relationships in Google SecOps?", opts: ["Use the Raw Log Scan view to group events by asset ID.", "Query for hostnames in UDM Search and filter the results by user.", "Generate an ingestion report to identify sources where the user appeared in the last seven days.", "Run a retrohunt to find rule matches triggered by the user."], ans: [1], exp: "UDM Search allows querying across all normalized event types and filtering by user to identify every asset they have interacted with across log sources." },
  { q: "Your organization recently acquired a Google Security Operations (SecOps) Enterprise Plus license. You are already ingesting Cloud Audit Logs, firewall logs, proxy logs and endpoint logs, but there are no threat intelligence feeds. You need to design and deploy a solution that alerts your team quickly if an IOC of an active breach is observed in your environment. What should you do?", opts: ["Write, enable, and configure alerting on a custom multi-event rule.", "Write, enable, and configure alerting on a custom single-event rule.", "Enable and configure alerting for relevant curated detection rule sets.", "Create and schedule a dashboard to send periodic summaries of the active breach IOCs."], ans: [2], exp: "Curated detection rule sets come pre-built and can be enabled immediately, the fastest path to IOC coverage without writing custom rules." },
  { q: "Your company has deployed two on-premises firewalls. You need to configure the firewalls to send logs to Google Security Operations (SecOps) using Syslog. What should you do?", opts: ["Pull the firewall logs by using a Google SecOps feed integration.", "Set the Google SecOps URL instance as the Syslog destination.", "Deploy a third-party agent (e.g. Bindplane, NXLog) on your on-premises environment, and set the agent as the Syslog destination.", "Deploy a Google Ops Agent on your on-premises environment, and set the agent as the Syslog destination."], ans: [2], exp: "Third-party collection agents like Bindplane act as Syslog receivers and forward logs to Google SecOps, the standard approach for on-premises firewall log collection." },
  { q: "You are a platform engineer migrating from a third-party SIEM to Google Security Operations (SecOps). You previously manually exported Active Directory (AD) context data and imported it as a watchlist. You want to improve this process using Google SecOps. What should you do?", opts: ["Configure a Google SecOps SOAR integration for AD to enrich user/asset information in your security alerts.", "Create a reference list that contains the AD context data. Use the reference list in your YARA-L rule.", "Create a data table that contains AD context data. Use the data table in your YARA-L rule.", "Ingest AD organizational context data as user/asset context to enrich user/asset information in your security events."], ans: [3], exp: "Ingesting AD data as user/asset entity context enriches events at the SIEM level, automatically correlating user and asset information across all events." },
  { q: "You manage a large fleet of Compute Engine instances. Security Health Analytics (SHA) has generated a CONFIDENTIAL_COMPUTING_DISABLED finding within Security Command Center (SCC). You need to quickly remediate this finding. What should you do?", opts: ["Delete the offending VM instance, and mute the finding.", "Delete the offending VM instance, and disable the SHA detector.", "Delete the offending VM instance, and manually mark the finding as inactive.", "Delete the offending VM instance, and allow the finding to be automatically marked as inactive."], ans: [3], exp: "When the underlying resource is deleted, SCC automatically marks the finding as inactive. Manual muting or marking defeats the purpose of automated posture management." },
  { q: "Your company's SOC recently responded to a ransomware incident. Multiple privileged service accounts exhibited anomalous behavior including credential dumping and scheduled task creation. You need to design an automated SOAR playbook to minimize dwell time and accelerate containment. Which action should you take in your playbook?", opts: ["Configure a step that revokes OAuth tokens and suspends sessions for high-privilege accounts based on entity risk.", "Add an approval step that requires an analyst to validate the alert before executing a containment action.", "Create an external API call to VirusTotal to submit hashes from forensic artifacts.", "Add a YARA-L rule that sends an alert when a document is executed using a scripting engine such as wscript.exe."], ans: [0], exp: "Revoking OAuth tokens and suspending sessions for high-risk accounts is the most direct automated containment action to minimize dwell time for compromised privileged accounts." },
  { q: "Your organization has decided that all security cases related to Data Loss Prevention (DLP) events must be categorized with a defined root cause specific to one of five DLP event types when the case is closed. How should you achieve this?", opts: ["Customize the Close Case dialog and add the five DLP event types as root cause options.", "Customize the Case Name format to include the DLP event type.", "Create a Google SecOps SOAR playbook that automatically assigns case tags where each tag contains the unique definition of one of the five DLP event types.", "Create case tags in Google SecOps SOAR where each tag contains a unique definition of each of the five DLP event types, and have analysts assign them manually."], ans: [0], exp: "Customizing the Close Case dialog enforces categorization at case closure with required root cause options, ensuring compliance for every DLP case." },
  { q: "You are investigating an alert in Google Security Operations (SecOps). You want to view previous enrichment attributes and relevant historical cases for an entity using the fewest number of steps. What should you do?", opts: ["Initiate a SIEM Search to query the entity.", "Initiate a SOAR Search to query the entity.", "Select View Details for the entity in the Entity Highlights widget.", "Select the entity identifier in the Entity Highlights widget to open Entity Explorer."], ans: [3], exp: "Entity Explorer, opened directly from the entity identifier in Entity Highlights, provides enrichment history and related cases in the fewest possible steps." },
  { q: "During a proactive threat hunting exercise, you discover that a critical production project has an external identity with a highly privileged IAM role. All logs are enabled and routed to a centralized Cloud Logging bucket and historical logs have been exported to BigQuery. You need to determine whether any actions were taken by this external identity. What should you do?", opts: ["Use Policy Analyzer to identify accessible resources. Examine the logs related to these resources in the centralized Cloud Logging bucket and BigQuery dataset.", "Analyze VPC Flow Logs exported to BigQuery, and correlate source IP addresses with potential login events for the external identity.", "Analyze IAM recommender insights and Security Command Center (SCC) findings associated with the external identity.", "Execute queries against the centralized Cloud Logging bucket and the BigQuery dataset to filter for logs where the principal email matches the external identity."], ans: [3], exp: "Directly querying logs where the principal email matches the external identity is the most targeted approach to identify all actions taken by that identity." },
  { q: "You are a security analyst at an organization that uses Google Security Operations (SecOps). You notice suspicious login attempts on several user accounts. You need to determine whether these attempts are part of a coordinated attack as quickly as possible. What action should you take first?", opts: ["Enable default curated detections to automatically block suspicious IP addresses.", "Use UDM Search to query historical logs for recent IOCs associated with the suspicious login attempts.", "Remove user accounts that have repeated invalid login attempts.", "Look for correlations across impacted users in the Risk Analytics dashboard."], ans: [3], exp: "The Risk Analytics dashboard provides immediate cross-entity correlation, making it the fastest first step to identify coordinated attack patterns across multiple users." },
  { q: "Your Google Security Operations (SecOps) instance is generating a high volume of alerts for an IP address flagged as a known C2 server. The IP address appears in repeated DNS queries originating from a sandboxing system used by your malware analysis team. You want to avoid alert fatigue while preserving visibility in the event that the IOC reappears in real production telemetry. What should you do?", opts: ["Temporarily disable the rule to avoid unnecessary alerts until the IOC expires in the threat feed.", "Add the IP address to a Google SecOps reference list, and configure the rule to suppress alerts for that list.", "Reduce the severity score in the rule configuration when the IOC match occurs in any internal IP address range.", "Add an exception in the detection rule to exclude matches originating from specific asset groups."], ans: [3], exp: "Excluding specific asset groups (the sandboxing environment) preserves detection for production systems while eliminating false positives from the test environment." },
  { q: "You are threat hunting for an advanced threat group known for targeted, novel attacks by deploying campaign-specific infrastructure. You want to develop detections based on the threat group's behaviors so you can effectively detect whether the threat group has attacked your organization. What should you do?", opts: ["Identify exposed technologies and products used by your organization, and develop detections to search for signs of exploitation.", "Find intelligence reports in Google Threat Intelligence that relate to the threat actor, identify their behavior in previous campaigns, and use past behavior to design detections in Google Security Operations (SecOps).", "Search for the threat actor in Google Threat Intelligence, export the IOCs associated with the threat actor into a Google Security Operations (SecOps) list, and develop detections that reference this list.", "Search for the threat actor in Google Threat Intelligence, review the threat actor's tactics, techniques, and procedures (TTPs), and design detections based on the TTPs in Google Security Operations (SecOps)."], ans: [3], exp: "TTP-based detections are more durable for APT actors. Behavioral patterns persist across campaigns unlike campaign-specific IOCs." },
  { q: "You work for a large international company that has several Compute Engine instances running in production. You need to configure monitoring and alerting for Compute Engine instances tagged with compliance=pci that have an external IP address assigned. What should you do?", opts: ["Create a custom Event Threat Detection module that alerts when a Compute Engine instance with the compliance=pci tag is assigned an external IP address.", "Deploy the compute.vmExternalIpAccess organization policy constraint to prevent specific projects with the compliance=pci tag from creating Compute Engine instances with external IP addresses.", "Create a custom Security Health Analytics (SHA) module. Configure the detection logic to scan Cloud Asset Inventory data for compute instances, and search for the compliance=pci tag.", "Use the PUBLIC_IP_ADDRESS Security Health Analytics (SHA) detector to identify Compute Engine instances with external IP addresses. Determine whether the compliance=pci tag exists on the instances."], ans: [3], exp: "The existing PUBLIC_IP_ADDRESS SHA detector handles detection; filtering results by the compliance tag reuses existing detection rather than building custom modules." },
  { q: "Your company's analyst team uses a playbook to make necessary changes to external systems integrated with Google Security Operations (SecOps). You need to automate the task to run once every day at a specific time. You want to minimize maintenance overhead. What should you do?", opts: ["Write a custom Google SecOps SOAR job in the IDE using the code from the existing playbook actions.", "Create a Google SecOps SOAR request and a playbook trigger to match the request from the user to start the playbook.", "Create a Cron Scheduled Connector for this use case. Configure a playbook trigger to match the cases created by the connector that runs the playbook with the relevant actions.", "Use a VM to host a script that runs a playbook via an API call."], ans: [2], exp: "The Cron Scheduled Connector natively supports time-based scheduling in SOAR with minimal maintenance. No external infrastructure required." },
  { q: "A server hosting an internal web application has been accidentally exposed to the internet for 48 hours. Logging is enabled on the server. You want to use Google Security Operations (SecOps) to run a UDM search against the server logs to identify whether there have been any successful exploitations. What event field search should you use?", opts: ["Perform a search for antimalware or endpoint security events by using the product_event_type UDM field.", "Perform a search for sign-on activity for user accounts that are not expected on the server by using the principal.user.userid UDM field.", "Perform a search for network traffic where the principal is rarely seen by using the principal.ip UDM field.", "Perform a search for process launches and commands that are rarely seen by using the metadata.event_type UDM field."], ans: [3], exp: "Searching for unusual process launches via metadata.event_type reveals post-exploitation activity like command execution that would indicate a successful compromise." },
  { q: "You have been tasked with creating a YARA-L detection rule that should identify when an internal host initiates a network connection to an external IP address that the Applied Threat Intelligence Fusion Feed associates with indicators attributed to APT41. You need to ensure the external IP is flagged if it has a documented relationship to other APT41 indicators within the Fusion Feed. How should you configure this YARA-L rule?", opts: ["Configure the rule to detect outbound network connections to the external IP. Create a Google SecOps SOAR playbook that queries the Fusion Feed to determine if the IP has an APT41 relationship.", "Configure the rule to establish a join between the live network connection event and Fusion Feed data for the common external IP address. Filter the joined Fusion Feed data for explicit associations with the APT41 threat group or related indicators.", "Configure the rule to check whether the external IP from the network connection event has a high confidence score across any enabled threat intelligence feed.", "Configure the rule to trigger when the external IP from the network connection event matches an entry in a manually pre-curated reference list of all APT41-related IP addresses."], ans: [1], exp: "Joining the network event with Fusion Feed data and filtering for APT41 associations enables real-time inline enrichment and correlation within the detection rule itself." },
  { q: "You are writing a detection rule in Google Security Operations (SecOps) SIEM that sends a risk score to the alert. You have access to Google Threat Intelligence (GTI) data through your subscription. You need to ensure that the threat score output in the detection logic informs the alert's risk score and is available for future detections. What should you do?", opts: ["Use the outcomes section of your detection logic to pull UDM enrichment fields from the event data. Apply logic to determine the total risk outcome, and store the risk score as the risk_score variable.", "Use the match section of your detection logic to filter out irrelevant entities. Store the remaining entities as the risk_score variable.", "Configure a feed in Google SecOps SIEM to ingest GTI data to automatically enrich the appropriate entities.", "Create a Google SecOps SOAR playbook to query GTI that uses the VirusTotal integration to enrich the alert. Modify the risk_score context value to match."], ans: [0], exp: "The outcomes section is designed for computing and storing risk scores. Variables defined there inform alert severity and are available for subsequent detections." },
  { q: "You are a SOC manager, and your company recently migrated to Google Security Operations (SecOps). As the team grows, you want to monitor all audit logs related to data feeds in Google SecOps. What should you do?", opts: ["Enable Data Access and Admin Activity audit logs in Cloud Logging, and ingest those logs into Google SecOps SIEM.", "Ingest the Google SecOps audit logs into Google SecOps SIEM for monitoring.", "Monitor Google SecOps SOAR user activity logs for administrative activity.", "Configure the Cloud Logging filter to ingest audit logs related to data feeds into Google SecOps for monitoring."], ans: [1], exp: "Google SecOps generates its own audit logs that capture feed-related administrative actions. Ingesting these into the SIEM provides the required monitoring capability." },
  { q: "Your company is taking a more proactive approach to security. You want to generate an alert when a binary hash first appears in your environment. What should you do?", opts: ["Enable the Applied Threat Intelligence - Curated Prioritization rule set in curated detections.", "Navigate to the Alerts and IOCs page in Google Security Operations (SecOps). Create a filter that targets hashes and specifies a first_seen_time value excluding the current date.", "Write a rule to examine file-related events that join with derived context for hashes in the entity graph. Compare the timestamp of the hash with the first_seen_time field.", "Create a table by using the Google Security Operations (SecOps) statistics in search to examine file-related events for the current day. Verify that the first_seen_time value predates the current day."], ans: [2], exp: "Joining file events with the entity graph and comparing event timestamp to the hash's first_seen_time directly detects when a hash is new to the environment." },
  { q: "You are a SOC manager guiding an implementation of your existing incident response plan (IRP) into Google Security Operations (SecOps). You need to capture time duration data for each of the case stages. You want to minimize maintenance overhead. What should you do?", opts: ["Configure a detection rule in SIEM Rules and Detections to include logic to capture the event fields for each case with the relevant stage metrics.", "Write a job in the IDE that runs frequently to check the progress of each case and updates the notes with timestamps.", "Configure Case Stages in the Google SecOps SOAR settings, and use the Change Case Stage action in your playbooks that captures time metrics when the stage changes.", "Create a Google SecOps SOAR dashboard that displays specific actions that have been run, identifies which stage a case is in, and calculates the time elapsed since the start of the case."], ans: [2], exp: "Built-in Case Stages with the Change Case Stage playbook action automatically captures timestamps at each stage transition. Minimal maintenance, native functionality." },
  { q: "Your organization recently implemented Google Security Operations (SecOps) with Applied Threat Intelligence enabled. You were notified about potentially anomalous communications to external domains in the last 30 days. You are ingesting firewall, proxy, DNS, and DHCP logs. What should you do? (Choose two.)", opts: ["Perform a UDM search across the logs for domains with geolocations that were first seen in the last 30 days.", "Perform a UDM search across the logs for domains with low prevalence that were first seen in the last 30 days.", "Perform a raw log search across the logs for domains with low prevalence that were first seen in the last 30 days.", "Identify the domains with the higher normalized risk in Risk Analytics. Drill down into those entities to determine their prevalence and if they were first seen in the last 30 days.", "Navigate to the IOC Matches page and filter based on domain type over the last 30 days. Look for the first seen and last seen timestamps for the reported domains."], ans: [1, 3], exp: "B: Low prevalence recently-seen domains in UDM identifies suspicious new communications. D: Risk Analytics surfaces high-risk domains with prevalence/first-seen context for efficient triage.", multi: true },
  { q: "Your company recently started pulling JSON logs from a third-party system into Google Security Operations (SecOps). You noticed that some fields are missing, and you want to parse them into UDM fields as quickly as possible. What should you do?", opts: ["Configure auto extraction to add the additional fields.", "Create parser extensions using the no-code approach.", "Create parser extensions using the code snippet approach.", "Submit a parser improvement request to Cloud Customer Care."], ans: [1], exp: "The no-code parser extension approach is the fastest way to add missing field mappings without writing code or waiting for vendor support." },
  { q: "You are a security engineer at a managed security service provider (MSSP) that is onboarding to Google Security Operations (SecOps). You need to ensure that cases for each customer are logically separated. How should you configure this logical separation?", opts: ["In Google SecOps SOAR settings, create a new environment for each customer.", "In Google SecOps SOAR settings, create a role for each customer.", "In Google SecOps SOAR settings, create a permissions group for each customer.", "In Google SecOps Playbooks, create a playbook for each customer."], ans: [0], exp: "SOAR environments provide logical case isolation. Each customer's cases stay within their environment, preventing cross-customer data access." },
  { q: "Your organization recently conducted a penetration test. You discover anomalous outbound traffic to external domains and suspect C2 communication. You need to identify the least common network communications over the last 14 days. What should you do?", opts: ["Perform a Google SecOps SIEM UDM search that looks for NETWORK_CONNECTION or NETWORK_HTTP events with low rolling prevalence for target domains over the last 14 days.", "Perform a Google SecOps SIEM UDM search that looks for NETWORK_CONNECTION or NETWORK_HTTP events with low rolling prevalence for principal domains over the last 14 days.", "Perform a Google SecOps SOAR search that looks for cases with low rolling prevalence of NETWORK_CONNECTION or NETWORK_HTTP events over the last 14 days.", "Perform a Google SecOps SIEM raw log search that looks for low rolling prevalence domains with NETWORK_CONNECTION or NETWORK_HTTP in the firewall and proxy logs over the last 14 days."], ans: [0], exp: "Searching UDM for target domains with low rolling prevalence identifies rarely-contacted external destinations, a key C2 indicator. Target domain is relevant for outbound C2 traffic." },
  { q: "Your organization is conducting a penetration test. The CISO has asked you to implement a real-time method to track cases that originate from the penetration test, and clearly differentiate these cases from other security incidents. What should you do?", opts: ["Implement case tagging within Google SecOps and apply a unique tag (e.g., PenTest) to all cases related to the penetration test entities. Use this tag for filtering and monitoring.", "Create a dashboard that is connected to the Google SecOps data lake. Use pre-built templates to visualize case status based on the penetration testing IP address range.", "Create a custom Google SecOps SOAR playbook that automatically extracts case metadata and sends an email summary to the CISO.", "Configure a custom alert rule that triggers a high-severity alert for all activity originating from the penetration testing team's source IP addresses."], ans: [0], exp: "Case tagging is the most efficient approach. It immediately labels cases for filtering, real-time monitoring, and differentiation from real incidents." },
  { q: "You are tasked with building a workflow in Google Security Operations (SecOps) SOAR. The documentation requires a logical split that has eight different possible paths. You need to break the workflow into eight separate workflows using an automatic and efficient approach. What should you do?", opts: ["Create eight playbooks for each workflow. Configure the triggered playbook to end on an instruction action that tells the analyst to pick a workflow from the playbooks tab.", "Create eight playbooks for each workflow. Create a job that identifies recently opened cases, applies the needed logic, and attaches the workflow to the alert.", "Create a playbook that uses a flow condition. Add four more branches to have a total of five branches and an Else branch. On the Else branch, include another flow condition with the remaining three branches.", "Create a playbook that uses a Multi-Choice Question flow and a second Multi-Choice Question for the additional answer choices."], ans: [2], exp: "A flow condition supports up to 5 branches + Else. Nesting a second flow condition on the Else branch provides 8 total paths in an automatic, codeless way." },
  { q: "You are a member of the incident response team working in a global enterprise. You need to identify all potential Google Threat Intelligence IOCs within your organization's data using Google Security Operations (SecOps). What should you do?", opts: ["Use the Cases page in Google SecOps.", "Create YARA-L rules to detect and alert when Google Threat Intelligence identifies potential threats.", "Use Gemini to perform a search for potential cybersecurity threats against your organization's data.", "Use the Alerts and IOCs page in Google SecOps."], ans: [3], exp: "The Alerts and IOCs page is specifically designed to show IOC matches from threat intelligence feeds including GTI against your ingested data." },
  { q: "You are a security operations engineer in an enterprise that uses Google Security Operations (SecOps). Your organization recently faced a cybersecurity breach. You need to increase the threat analytics as quickly as possible. What should you do?", opts: ["Enable curated detections to identify threats.", "Design YARA-L detection rules based on Google SecOps Marketplace use cases.", "Develop YARA-L detection rules that focus on threat intelligence.", "Ingest data from a threat intelligence platform (TIP) into Google SecOps."], ans: [0], exp: "Enabling curated detections provides immediate Google-maintained detection coverage with no development time, the fastest path to improved detection." },
  { q: "You are investigating whether an APT actor has operated in your environment undetected. You have received threat intelligence including a SHA256 hash for a malicious DLL, a known C2 domain, and a behavior pattern where rundll32.exe spawns powershell.exe with obfuscated arguments. Process hashes are not reliably captured due to inconsistent Sysmon configuration. What should you do?", opts: ["Write a multi-event YARA-L detection rule that correlates the process relationship and hash, and run a retrohunt based on this rule.", "Build a reference list that contains the hash and domain, and link the list to a high-frequency rule for near real-time alerting.", "Create a single-event YARA-L detection rule based on the file hash, and run the rule against historical and incoming telemetry.", "Use Google SecOps search to identify recent uses of rundll32.exe, and tag affected assets for watchlisting."], ans: [0], exp: "A multi-event rule correlating the process relationship (rundll32 spawning powershell) can detect the behavior even when hash capture is unreliable, and a retrohunt covers historical data." },
  { q: "You are a SOC manager at an organization that recently implemented Google Security Operations (SecOps). You need to monitor data ingestion health. Data is ingested with Bindplane collection agents. You want to receive a notification when data sources go silent within 15 minutes and visualize ingestion throughput and parsing errors. What should you do?", opts: ["Configure notifications in Cloud Monitoring when ingestion sources become silent in Bindplane. Monitor using Bindplane Observability Pipeline (OP).", "Configure silent source notifications for Google SecOps collection agents in Cloud Monitoring. Create a Cloud Monitoring dashboard to visualize data ingestion metrics.", "Configure silent source alerts based on rule detections for anomalous data ingestion activity in Risk Analytics.", "Configure automated scheduled delivery of an ingestion health report in the Data Ingestion and Health dashboard."], ans: [1], exp: "Cloud Monitoring silent source notifications handle the alerting requirement; a Cloud Monitoring dashboard with ingestion metrics handles visualization. Both are native features." },
  { q: "Your organization has recently onboarded to Google Cloud with Security Command Center Enterprise (SCCE) and is now integrating it with your organization's SOC. You want to automate the response process and integrate with the existing SOC ticketing system. How should you implement this functionality?", opts: ["Evaluate each event within the SCC console. Create a ticket for each finding in the ticketing system manually.", "Use the SCC notifications feed to send alerts to Pub/Sub. Ingest these feeds using the relevant SIEM connector.", "Configure the SCC notifications feed to use Pub/Sub for alerts. Create a Cloud Run function to trigger when an event arrives in the topic and generate a ticket by calling the API endpoint in the SOC ticketing system.", "Disable the generic posture finding playbook in Google Security Operations (SecOps) SOAR and enable the playbook for the ticketing system."], ans: [2], exp: "SCC Pub/Sub notifications plus Cloud Run provides automated, event-driven ticket creation via the ticketing system API. Fully automated and scalable." },
  { q: "You are creating a playbook for the SOC. The SOC requires that each Google Security Operations (SecOps) role sees different information for the alert that the playbook runs on. You need to ensure that the playbook presents the relevant information for each Google SecOps role. What should you do?", opts: ["Add a view to the playbook for each Google SecOps role.", "Add the Case Comment action to the playbook for each Google SecOps role.", "Add the Create Siemplify Task action to the playbook to assign a task to each Google SecOps role.", "Add the Add General insight action to the playbook for each Google SecOps role."], ans: [0], exp: "Views in SOAR playbooks support role-based content presentation. Each role sees their relevant view of the same alert." },
  { q: "You are responsible for evaluating the level of effort required to integrate a new third-party endpoint detection tool with Google Security Operations (SecOps). Your organization's leadership wants to minimize customization for faster deployment. You need to verify that Google SecOps SOAR and SIEM support the expected workflows for the new third-party tool. What should you do? (Choose two.)", opts: ["Develop a custom integration that uses Python scripts and Cloud Run functions to forward logs and orchestrate actions.", "Configure a Pub/Sub topic to ingest raw logs from the third-party tool and build custom YARA-L rules.", "Review the architecture of the tool to identify the cloud provider that hosts the tool.", "Review the documentation to identify if default parsers exist for the tool, and determine whether the logs are supported and able to be ingested.", "Identify the tool in the Google SecOps Marketplace and verify support for the necessary actions in the workflow."], ans: [3, 4], exp: "D: Checking for default parsers confirms SIEM ingest support. E: The Marketplace shows available SOAR integrations and supported actions. Both validate out-of-box support quickly.", multi: true },
  { q: "You are the SOC manager at a large enterprise. You need to create a report showing the Return on Investment (ROI) attributed to analyst activities in Google SecOps SOAR for the previous month, including time saved and efficiency gains. What should you do?", opts: ["Create a custom Google SecOps SOAR search query that filters for all cases handled by specific analysts in the last month. Export the results to a spreadsheet.", "Use the ROI - Analysts Benchmark report in SOAR Reports. Configure the report to display data for the desired time period, and filter by individual analysts.", "Use the filters and visualizations in the Management - SOC Status report in SOAR Reports to extract case-specific performance data.", "Develop a Google SecOps SOAR playbook that automatically aggregates analyst performance metrics and generates a PDF report on a monthly schedule."], ans: [1], exp: "The built-in ROI Analysts Benchmark report is purpose-built for this use case. No custom development needed." },
  { q: "Your company works with an external Managed Service Provider (MSP) that requires its users to have the ability to list findings from Security Command Center (SCC) using the Google Cloud SDK. You need to configure the required access while minimizing your involvement in their external user lifecycle management processes. What should you do?", opts: ["Create a user account in your Cloud Identity instance using a subdomain. Grant this user account the appropriate IAM role at the organization level.", "Create a service account in a SCC project. Grant the MSP user permission to impersonate this account. Grant this service account the appropriate IAM role at the organization level.", "Create a workload identity pool in a SCC project. Grant the MSP user the permission to impersonate a service account from this pool.", "Create a workforce identity pool and federate with the identity provider (IdP) of the managed service provider. Grant users of the MSP the appropriate IAM role at the organization level."], ans: [3], exp: "Federating with the MSP's IdP via workforce identity federation means the MSP manages their own user lifecycle. You only manage IAM roles, minimizing your involvement." },
  { q: "You are conducting a proactive threat hunt in Google Security Operations (SecOps). You observe multiple login events with the same principal.user.userid field that originate from different countries within a short time window. You need to validate whether the account has been compromised. What should you do?", opts: ["Use the entity graph to correlate the user's risk score with linked assets, and review any active alerts.", "Perform a YARA-L 2.0 search for login events and their associated principal.location.country field. Use an outcome field to aggregate the number of failed logins.", "Perform a UDM search for login events, and pivot to group results by user and country of origin.", "Run a YARA-L retrohunt rule that detects users who are logging in from multiple regions using multiple entity contexts."], ans: [2], exp: "UDM search with grouping by user and country provides immediate visibility into the geographic dispersion of login events to validate impossible travel." },
  { q: "You are using a Google-managed image on a Compute Engine instance in Google Cloud to run an application. You need to ingest the application's log output into Google Security Operations (SecOps). The log output has a valid label and parser in Google SecOps. Your solution must minimize the cost and time required. What should you do?", opts: ["Use the Ops Agent embedded in the Compute Engine image to pull the logs into Cloud Logging. Use the direct ingestion mechanism to ingest the logs from Google Cloud into Google SecOps.", "Deploy a Bindplane agent on the image to collect and send the logs to Google SecOps.", "Create a script on the workload that reads the logs and uses the Google SecOps Ingestion API to push them to Google SecOps.", "Use the Ops Agent embedded in the Compute Engine image to pull the logs into a Cloud Storage bucket. Create a feed in Google SecOps to ingest the logs."], ans: [0], exp: "The Ops Agent is pre-embedded in Google-managed images and Cloud Logging direct ingestion to Google SecOps is the lowest-cost, fastest path with no additional agents needed." },
  { q: "You are a security analyst at a company that uses Google Security Operations (SecOps) Enterprise, Security Command Center Enterprise (SCCE), and Google Threat Intelligence (GTI). You need to leverage threat intelligence to improve threat hunting capabilities to proactively identify novel and emerging attack patterns targeting your Google Cloud environment in near real-time. What should you do?", opts: ["Use the built-in threat intelligence of Event Threat Detection in SCCE to detect relevant threats.", "Configure an Applied Threat Intelligence Fusion Feed in Google SecOps, and develop YARA-L detection rules to search ingested Google Cloud telemetry for patterns matching this intelligence.", "Route all Google Cloud logs to a dedicated BigQuery dataset, and use scheduled queries with curated open-source threat intelligence feeds.", "Configure Google Cloud Armor security policies with preconfigured WAF rule sets, and enable Adaptive Protection to use GTI."], ans: [1], exp: "The Applied Threat Intelligence Fusion Feed continuously updates threat data in Google SecOps, and custom YARA-L rules enable near-real-time detection against Cloud telemetry." },
  { q: "You are developing a playbook to respond to phishing reports from users at your company. You configured a UDM query action to identify all users who have connected to a malicious domain. You need to extract the users from the UDM query and add them as entities in an alert so the playbook can reset the password for those users. You want to minimize effort required by the SOC analyst. What should you do?", opts: ["Use the Create Entity action from the Siemplify integration. Use the Expression Builder to create a placeholder with the usernames in the Entities Identifier parameter.", "Create a case for each identified user with the user designated as the entity.", "Implement an Instruction action from the Flow integration that instructs the analyst to add the entities in the Google SecOps user interface.", "Configure a manual Create Entity action from the Siemplify integration that instructs the analyst to input the Entities Identifier parameter based on the results of the action."], ans: [0], exp: "Using the Create Entity action with the Expression Builder automates entity creation from the UDM query results, eliminating manual analyst steps." },
  { q: "You are a security engineer at a financial technology company. You need to create a centralized dashboard to provide security posture visibility for your leadership team with insights from SCC findings and security-related events in Cloud Logging, supporting large volumes of historical data, and the ability to join SCC findings and audit logs. What should you do?", opts: ["Ingest the SCC findings and Cloud Audit Logs into a Cloud Storage bucket. Write a Python script that reads the data and uses Matplotlib to create the visualizations.", "Create custom metrics in Cloud Monitoring based on the SCC findings, and configure log-based metrics for security-related events. Build Cloud Monitoring dashboards.", "Export SCC findings and Cloud Audit Logs to BigQuery. Connect Looker Studio to the BigQuery datasets, and create the visualizations and filters.", "Use the built-in SCC dashboard to visualize SCC findings, and extract log counts for specific log events from Cloud Audit Logs."], ans: [2], exp: "BigQuery supports large historical datasets and JOIN operations; Looker Studio provides rich visualization. Together they meet all requirements with managed services." },
  { q: "Your organization has mission-critical production Compute Engine VMs. While performing a UDM search, you discover several outbound network connections from one of the production VMs to an unfamiliar external IP address over the last 48 hours. You need to quickly gather more context and assess the reputation of the external IP address. What should you do?", opts: ["Examine the Google SecOps Asset view details for the production VM.", "Create a new detection rule to alert on future traffic from the external IP address.", "Search for the external IP address in the Alerts and IOCs page in Google SecOps.", "Perform a UDM search to identify the specific user account that was logged into the production VM when the connections occurred."], ans: [2], exp: "The Alerts and IOCs page provides immediate threat intelligence context and reputation data for the IP, including any existing IOC matches." },
  { q: "You discover that some detection rules are being triggered for internal IP addresses in the 192.0.2.0/8 subnet causing false positive alerts. You want to improve these detection rules. What should you add to the YARA-L detection rules?", opts: ["net.ip_in_range_cidr(all $e.principal.ip, '192.0.2.0/8')", "net.ip_in_range_cidr(any $e.principal.ip, '192.0.2.0/8')", "not net.ip_in_range_cidr(all $e.principal.ip, '192.0.2.0/8')", "not net.ip_in_range_cidr(any $e.principal.ip, '192.0.2.0/8')"], ans: [3], exp: "Using 'not any' excludes events where ANY principal IP falls within the CIDR range, properly filtering out all internal IP matches to reduce false positives." },
  { q: "Your team has onboarded a new log source from a third-party DNS filtering solution. After ingestion, key UDM fields such as network.dns.questions.name and metadata.product_event_type are missing from the parsed events. You need to ensure these fields are available for downstream detection rules. What should you do?", opts: ["Modify the ingestion source definition to remap raw fields directly to UDM by using the UDM sample output.", "Enable asset enrichment for the log source to infer missing fields based on correlated host activity.", "Use a custom parser that outputs all fields as raw JSON for detection.", "Create a parser extension that maps the missing source fields to the correct UDM fields and attach it to the existing parser."], ans: [3], exp: "A parser extension adds field mappings on top of the existing parser without replacing it, the minimal-effort way to add missing UDM field mappings." },
  { q: "You are ingesting and parsing logs from an SSO provider and an on-premises appliance. Users are tagged as 'restricted' by an internal process. Restrictions last five days from the most recent flagging time. You need to create a rule to detect when restricted users log into the appliance. Your solution must be quickly implemented and easily maintained. What should you do?", opts: ["Use a Google SecOps SOAR global context value to store a list of flagged users with their corresponding time to live values. Use a SOAR job to dynamically build and deploy a new version of the detection rule.", "Store the identifiers of the flagged users in the detection rule logic. Actively monitor for newly flagged users, and add them to the detection rule logic.", "Ingest the user flags as custom enrichment data using a feed. Use a multi-event detection rule to find logins from users flagged in the entity graph.", "Store the flagged users in a data table column with their corresponding time to live values in a second column. Use row-based comparisons in your detection rule."], ans: [2], exp: "Ingesting flags as enrichment data and using a multi-event rule with entity graph correlation handles automatic expiry and is maintainable without rule updates." },
  { q: "You are receiving security alerts from multiple connectors in your Google Security Operations (SecOps) instance. You need to identify which IP address entities are internal to your network and label each entity with its specific network name. This network name will be used as the trigger for the playbook. What should you do?", opts: ["Configure each network in the Google SecOps SOAR settings.", "Enrich the IP address entities as the initial step of the playbook.", "Modify the entity attribute in the alert overview.", "Create an outcome variable in the rule to assign the network name."], ans: [1], exp: "Enriching IP entities at the start of the playbook dynamically identifies internal/external status and assigns network names before subsequent playbook actions." },
